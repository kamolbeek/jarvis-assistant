<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jarvis — ish stoli HUD</title>

<style>
  /* Sahna butunlay canvas'da chiziladi (shell.js — ui/renderer/ dan aynan
     o'zi). Bu yerda faqat uning ustidagi matnli qatlamlar va demo tugmalari. */
  :root {
    --cyan: #22e3ff;
    --white: #ecfdff;
    --ink: rgba(6, 14, 20, 0.82);
    --edge: rgba(34, 227, 255, 0.22);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #01060a;
    color: var(--white);
    font-family: ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  #scene { position: fixed; inset: 0; }
  #scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #fx-canvas { pointer-events: none; }
  #figure {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: none; object-fit: contain; pointer-events: none;
  }
  #figure.on { display: block; }
  body.calibrating #figure { pointer-events: auto; cursor: crosshair; }

  .blk { position: absolute; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; }

  #caption {
    left: 50%; bottom: 112px; transform: translateX(-50%);
    max-width: 560px; padding: 10px 16px;
    background: var(--ink); border: 1px solid var(--edge); border-radius: 10px;
    font-family: inherit; font-size: 13.5px; letter-spacing: 0; text-align: center;
    opacity: 0; transition: opacity 200ms ease;
  }
  #caption.on { opacity: 1; }
  #caption b { color: var(--cyan); font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; margin-right: 8px; }

  #dial-panel {
    left: 30px; bottom: 30px; width: 330px; height: 330px;
    background: rgba(4, 11, 16, 0.94);
    border: 1px solid var(--edge); border-radius: 16px; padding: 8px;
    display: none;
  }
  #dial-panel.on { display: block; }
  #dial-panel canvas { width: 100%; height: 100%; }

  /* ---------- demo boshqaruvi (haqiqiy ish stolida yo'q) ---------- */

  #drawer { right: 22px; top: 168px; z-index: 5; }
  #drawer summary {
    list-style: none; cursor: pointer;
    font: 700 10px var(--mono); letter-spacing: 0.2em; color: var(--cyan);
    border: 1px solid var(--edge); padding: 6px 12px;
    background: var(--ink); border-radius: 8px; text-align: center;
  }
  #drawer[open] summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  #drawer .body {
    background: var(--ink); border: 1px solid var(--edge); border-top: 0;
    border-radius: 0 0 10px 10px; padding: 10px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 250px;
  }
  #drawer button {
    font: 600 11px var(--mono); color: var(--white);
    background: rgba(34, 227, 255, 0.06);
    border: 1px solid rgba(34, 227, 255, 0.24);
    border-radius: 7px; padding: 7px 4px; cursor: pointer;
  }
  #drawer button:hover { background: rgba(34, 227, 255, 0.16); }
  #drawer button.on { border-color: var(--cyan); color: var(--cyan); }
  #drawer button.wide { grid-column: 1 / -1; background: rgba(34, 227, 255, 0.14); }
  #drawer p { grid-column: 1 / -1; font: 500 10px var(--mono); color: rgba(236,253,255,0.45); line-height: 1.5; }
</style>

<div id="scene">
  <!-- O'z rasmingiz — ixtiyoriy, markazdagi zirh o'rniga -->
  <img id="figure" alt="" draggable="false" />
  <canvas id="hud-canvas"></canvas>
  <canvas id="fx-canvas"></canvas>

  <div class="blk" id="caption"><b></b><span></span></div>
  <div class="blk" id="dial-panel"><canvas id="dial-canvas"></canvas></div>

  <details class="blk" id="drawer">
    <summary>DEMO BOSHQARUVI</summary>
    <div class="body">
      <button class="wide" id="play">▶ Suhbat: qarsakdan javobgacha</button>
      <button data-state="idle" class="on">Kutish</button>
      <button data-state="wake">Uyg'onish</button>
      <button data-state="listening">Tinglash</button>
      <button data-state="thinking">O'ylash</button>
      <button data-state="speaking">Gapirish</button>
      <button data-state="error">Xato</button>
      <button class="wide" id="break">NUTQ bo'g'inini buzish / tuzatish</button>
      <button class="wide" id="drop-hint">🖼 O'z rasmingizni shu yerga tashlang</button>
      <p>Bu demoda ko'rsatkichlar taqlid qilinadi. Haqiqiy ish stolida
         soat, CPU, RAM, disk, batareya, tarmoq va ovoz — kompyuteringizdan;
         tugmalar esa haqiqiy ilova va papkalarni ochadi.</p>
    </div>
  </details>
</div>

<script>
/* --- ui/renderer/ dan aynan ko'chirilgan modullar --- */
/*INJECT*/

/* --- Demo manbasi: haqiqiy ilovada bu ma'lumotlar Electron va yadrodan keladi --- */

const dialPanel = document.getElementById("dial-panel");

// Bo'g'inlar — siferblat paneli uchun
const LABELS = { mic: "MIKROFON", wake: "UYG'OTISH", stt: "NUTQ", brain: "MIYA", tts: "OVOZ",
                 memory: "XOTIRA", agenda: "REJA", tools: "ASBOB", net: "TARMOQ" };
const systems = Object.entries(LABELS).map(([id, label]) => ({ id, label, status: "ready", detail: "", heat: 0 }));
const heatUntil = {};
const heat = (id, s = 1.4) => { heatUntil[id] = performance.now() / 1000 + s; };

const app = DESKAPP.start({
  figureRect,  // funksiya quyida e'lon qilingan — hoisting bilan ishlaydi
  actions: {
    openApp: (name) => app.caption("Demo", `Haqiqiy ish stolida «${name}» ilovasi ochiladi`),
    openFolder: (key) => app.caption("Demo", `Haqiqiy ish stolida «${key}» papkasi ochiladi`),
    openUrl: (url) => window.open(url, "_blank"),
    openTrash: () => app.caption("Demo", "Haqiqiy ish stolida axlat qutisi ochiladi"),
    setVolume: (v) => { sim.volume = v; app.caption("Demo", `Tizim ovozi ${v}% ga qo'yildi`); },
    media: (action) => app.caption("Demo", `Media: ${action} — haqiqiy pleyerga uzatiladi`),
    activate: () => document.getElementById("play").click(),
  },
});

app.setSystems(systems);

// --- Taqlid qilingan ko'rsatkichlar ---

const sim = {
  cpu: 18, ram: 58, swap: 12, volume: 45,
  uptimeSec: 3600 * 5 + 60 * 14,
  net: { down: 1.2e6, up: 240e3 },
};

function tick() {
  sim.cpu = Math.max(4, Math.min(96, sim.cpu + (Math.random() - 0.5) * 16));
  sim.ram = Math.max(35, Math.min(88, sim.ram + (Math.random() - 0.5) * 5));
  sim.swap = Math.max(0, Math.min(60, sim.swap + (Math.random() - 0.5) * 4));
  sim.uptimeSec += 2;
  sim.net = {
    down: Math.max(0, sim.net.down + (Math.random() - 0.5) * 1.6e6),
    up: Math.max(0, sim.net.up + (Math.random() - 0.5) * 300e3),
  };
  app.setStats({
    cpu: sim.cpu,
    ram: sim.ram,
    swap: sim.swap,
    ramUsedGb: 16 * (sim.ram / 100),
    ramTotalGb: 16,
    uptimeSec: sim.uptimeSec,
    volume: sim.volume,
    user: "stark",
    host: "jarvis-mac",
    ip: "192.168.1.24",
    city: "TOSHKENT",
    trash: 23,
    battery: { percent: 78, charging: false },
    net: sim.net,
    disks: [
      { name: "Macintosh HD", percent: 62, usedGb: 280.7, totalGb: 916.7 },
      { name: "Data", percent: 89, usedGb: 13.2, totalGb: 14.7 },
      { name: "Backup", percent: 41, usedGb: 820, totalGb: 2000 },
    ],
  });
}
tick();
setInterval(tick, 2000);

app.setWeather({ today: { max: 31, min: 19, code: 0 }, tomorrow: { max: 29, min: 18, code: 2 } });
app.setMedia({ title: "Back In Black", artist: "AC/DC", playing: true, position: 74, duration: 255 });

// Ovoz darajasi — holatga qarab taqlid qilinadi
setInterval(() => {
  const t = performance.now() / 1000;
  const s = app.state.state;
  const level =
    s === "listening" ? 0.35 + Math.abs(Math.sin(t * 2.7) * Math.sin(t * 1.3)) * 0.55 :
    s === "speaking" ? 0.30 + Math.abs(Math.sin(t * 4.4)) * 0.45 : 0.03;
  app.setLevel(level);
  // Bo'g'inlar qizishi — siferblat panelida ko'rinadi
  for (const sys of systems) {
    const until = heatUntil[sys.id] || 0;
    sys.heat = sys.status === "down" ? 0 : Math.max(0, Math.min(1, (until - t) / 1.4));
  }
}, 60);

/* --- Demo tugmalari --- */

function setState(next) {
  app.setState(next);
  app.engage();
  document.querySelectorAll("#drawer [data-state]").forEach((b) =>
    b.classList.toggle("on", b.dataset.state === next));
}

document.querySelectorAll("#drawer [data-state]").forEach((b) =>
  b.addEventListener("click", () => { setState(b.dataset.state); app.caption("", ""); }));

document.getElementById("break").addEventListener("click", () => {
  const stt = systems.find((s) => s.id === "stt");
  stt.status = stt.status === "down" ? "ready" : "down";
  stt.detail = stt.status === "down" ? "sinov uchun o'chirildi" : "";
  dialPanel.classList.add("on");
  app.caption("Tizim", stt.status === "down"
    ? "NUTQ bo'g'ini uzildi — siferblat qizardi"
    : "NUTQ bo'g'ini tiklandi");
});

document.getElementById("drop-hint").addEventListener("click", () =>
  app.caption("Rasm", "Kompyuterdagi rasm faylini sichqoncha bilan shu oynaga sudrab tashlang"));

const SCRIPT = [
  [0,     () => { setState("idle"); app.caption("", ""); }],
  [700,   () => { heat("mic"); heat("wake"); setState("wake"); app.caption("Qarsak", "· ·"); }],
  [1500,  () => { setState("listening"); app.caption("Jarvis", "Buyrug'ingizni kutyapman."); }],
  [3200,  () => { heat("mic", 2); app.caption("Siz", "iLevel loyihasi qaysi bosqichda?"); }],
  [5000,  () => { heat("stt", 1.4); setState("thinking"); }],
  [5600,  () => { heat("brain", 3); heat("memory", 1.6); heat("agenda", 1.6); }],
  [7400,  () => { heat("tts", 3); setState("speaking");
                  app.caption("Jarvis", "iLevel test bosqichida. Keyingi qadam — deploy, muddati juma."); }],
  [11000, () => { setState("idle"); app.caption("", ""); }],
];
let timers = [];
document.getElementById("play").addEventListener("click", () => {
  timers.forEach(clearTimeout);
  timers = SCRIPT.map(([at, fn]) => setTimeout(fn, at));
});

/* --- O'z rasmingiz: sahifaga tashlang, uch marta bosib sozlang --- */

const figureImg = document.getElementById("figure");
let figureCal = null;
let calSteps = [];

function figureRect() {
  const box = figureImg.getBoundingClientRect();
  const nw = figureImg.naturalWidth, nh = figureImg.naturalHeight;
  if (!nw || !nh) return null;
  const scale = Math.min(box.width / nw, box.height / nh);
  const w = nw * scale, h = nh * scale;
  return { x: box.left + (box.width - w) / 2, y: box.top + (box.height - h) / 2, w, h };
}

figureImg.addEventListener("click", (e) => {
  if (!calSteps.length) return;
  const rect = figureRect();
  if (!rect) return;
  const key = calSteps.shift();
  figureCal = figureCal || {};
  figureCal[key] = [(e.clientX - rect.x) / rect.w, (e.clientY - rect.y) / rect.h];
  app.setFigure(true, figureCal);
  if (calSteps.length === 2) app.caption("Sozlash", "Endi O'NG ko'zga bosing");
  else if (calSteps.length === 1) app.caption("Sozlash", "Endi REAKTORGA bosing");
  else {
    document.body.classList.remove("calibrating");
    app.caption("Sozlash", "Tayyor! «Gapirish» tugmasida ko'zlar yonadi.");
  }
});

window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!file || !file.type.startsWith("image/")) return;
  figureImg.src = URL.createObjectURL(file);
  figureImg.onload = () => {
    figureImg.classList.add("on");
    figureCal = null;
    calSteps = ["eyeL", "eyeR", "core"];
    app.setFigure(true, null);
    document.body.classList.add("calibrating");
    app.caption("Sozlash", "Rasmda CHAP ko'zga bosing (keyin o'ng ko'z, keyin reaktor)");
  };
});
</script>
