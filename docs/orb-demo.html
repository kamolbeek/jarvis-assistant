<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jarvis — ish stoli HUD</title>

<style>
  :root {
    --cyan: #22e3ff;
    --white: #ecfdff;
    --amber: #ffb23e;
    --red: #ff443a;
    --slate: #607e8c;
    --steel: #2a3540;
    --ink: rgba(6, 14, 20, 0.78);
    --edge: rgba(34, 227, 255, 0.22);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: #030a0f;
    color: var(--white);
    font-family: ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  #scene { position: fixed; inset: 0; }
  #scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #figure { position: absolute; inset: 0; width: 100%; height: 100%; display: none; object-fit: contain; pointer-events: none; }
  #figure.on { display: block; }
  #fx-canvas { pointer-events: none; }
  body.calibrating #figure { pointer-events: auto; cursor: crosshair; }
  /* O'rnatilgan wallpaper rejimi: rasmning o'z vidjetlari bor, DOM'dagilar yashirinadi */
  body.wallpaper #rail-left, body.wallpaper #sys-block, body.wallpaper #dates,
  body.wallpaper #links, body.wallpaper #weather, body.wallpaper #disk,
  body.wallpaper #clock, body.wallpaper #folders, body.wallpaper #vertical-tag { display: none; }
  /* Jonli ma'lumotlar chizig'i — rasm ostidagi qatorda */

  /* ---------- umumiy HUD bloklari ---------- */

  .blk {
    position: absolute;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
  }

  .blk h3 {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.24em;
    color: rgba(236, 253, 255, 0.4);
    margin-bottom: 7px;
  }

  /* Burchakli ilova tugmasi — havoladagi chap paneldagidek */
  .chip {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 150px;
    padding: 7px 12px;
    margin-bottom: 7px;
    background: linear-gradient(90deg, rgba(42, 53, 64, 0.85), rgba(42, 53, 64, 0.35));
    border-left: 3px solid var(--amber);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%);
    color: var(--white);
    font: 600 11px var(--mono);
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 130ms ease, border-color 130ms ease;
  }
  .chip:hover { background: linear-gradient(90deg, rgba(34,227,255,0.22), rgba(42,53,64,0.4)); border-left-color: var(--cyan); }
  .chip:active { filter: brightness(1.5); }
  .chip .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); flex: none; }

  /* Tezkor havolalar ustuni */
  .link {
    display: block;
    font: 600 10.5px var(--mono);
    letter-spacing: 0.22em;
    color: rgba(236, 253, 255, 0.6);
    padding: 3.5px 0;
    cursor: pointer;
    text-align: center;
    transition: color 120ms ease, text-shadow 120ms ease;
  }
  .link:hover { color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }

  /* ---------- aniq bloklar ---------- */

  #rail-left { left: 26px; top: 60px; }

  #vertical-tag {
    left: 8px; top: 50%;
    transform: rotate(180deg);
    writing-mode: vertical-rl;
    font: 700 9px var(--mono);
    letter-spacing: 0.5em;
    color: rgba(236, 253, 255, 0.25);
  }

  #sys-block { left: 26px; top: 335px; width: 168px; }
  #sys-block .row { display: flex; justify-content: space-between; padding: 2.5px 0; color: rgba(236,253,255,0.75); }
  #sys-block .row b { color: var(--cyan); font-weight: 700; }
  #sys-block .bar { height: 3px; background: rgba(34,227,255,0.12); margin: 1px 0 6px; }
  #sys-block .bar i { display: block; height: 100%; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); transition: width 600ms ease; }
  #sys-block .bar.warm i { background: var(--amber); box-shadow: 0 0 6px var(--amber); }

  #dates {
    top: 22px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 14px;
    font: 600 12px var(--mono);
    color: rgba(236,253,255,0.45);
  }
  #dates span.today {
    color: var(--cyan);
    text-shadow: 0 0 12px var(--cyan);
    border: 1px solid var(--edge);
    padding: 1px 7px; margin: -2px -8px;
  }

  #links { top: 64px; left: calc(50% - 300px); width: 120px; }

  #weather { top: 70px; right: calc(50% - 330px); text-align: left; width: 150px; }
  #weather .day { margin-bottom: 9px; }
  #weather .day b { display: block; font-size: 11px; color: var(--cyan); letter-spacing: 0.18em; }
  #weather .day span { font-size: 15px; color: var(--white); font-weight: 700; }
  #weather .day small { display: block; font-size: 9.5px; color: rgba(236,253,255,0.5); }

  #disk { top: 26px; right: 30px; text-align: right; color: rgba(236,253,255,0.7); }
  #disk b { color: var(--cyan); }

  #clock {
    right: 205px; top: 47%;
    display: flex; align-items: center; gap: 12px;
    font: 700 30px var(--mono);
    color: var(--white);
    text-shadow: 0 0 16px rgba(34, 227, 255, 0.6);
  }
  #clock::after {
    content: "";
    width: 90px; height: 1px;
    background: linear-gradient(90deg, var(--cyan), transparent);
  }
  #clock small { font-size: 10px; letter-spacing: 0.2em; color: rgba(236,253,255,0.5); align-self: flex-end; margin-bottom: 6px; }

  #folders { right: 30px; bottom: 26px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 560px; }
  #folders .chip { width: auto; margin: 0; border-left-color: var(--steel); background: linear-gradient(90deg, rgba(42,53,64,0.7), rgba(42,53,64,0.25)); }
  #folders .chip:hover { border-left-color: var(--cyan); }

  #caption {
    left: 50%; bottom: 30px;
    transform: translateX(-50%);
    max-width: 520px;
    padding: 10px 16px;
    background: var(--ink);
    border: 1px solid var(--edge);
    border-radius: 10px;
    font-family: inherit;
    font-size: 13.5px;
    letter-spacing: 0;
    text-align: center;
    opacity: 0;
    transition: opacity 200ms ease;
  }
  #caption.on { opacity: 1; }
  #caption b { color: var(--cyan); font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; margin-right: 8px; }

  /* Emblema bosilganda ochiladigan siferblat paneli */
  #dial-panel {
    left: 30px; bottom: 210px;
    width: 330px; height: 330px;
    background: rgba(4, 11, 16, 0.9);
    border: 1px solid var(--edge);
    border-radius: 16px;
    padding: 8px;
    display: none;
  }
  #dial-panel.on { display: block; }
  #dial-panel canvas { width: 100%; height: 100%; }

  /* ---------- demo boshqaruvi (haqiqiy ish stolida yo'q) ---------- */

  #drawer {
    left: 50%; top: 500px; transform: translateX(-50%);
    z-index: 5;
  }
  #drawer summary {
    list-style: none;
    cursor: pointer;
    font: 700 10px var(--mono);
    letter-spacing: 0.2em;
    color: var(--cyan);
    border: 1px solid var(--edge);
    padding: 6px 12px;
    background: var(--ink);
    border-radius: 8px;
    text-align: center;
  }
  #drawer[open] summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  #drawer .body {
    background: var(--ink);
    border: 1px solid var(--edge);
    border-top: 0;
    border-radius: 0 0 10px 10px;
    padding: 10px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    width: 250px;
  }
  #drawer button {
    font: 600 11px var(--mono);
    color: var(--white);
    background: rgba(34, 227, 255, 0.06);
    border: 1px solid rgba(34, 227, 255, 0.24);
    border-radius: 7px;
    padding: 7px 4px;
    cursor: pointer;
  }
  #drawer button:hover { background: rgba(34, 227, 255, 0.16); }
  #drawer button.on { border-color: var(--cyan); color: var(--cyan); }
  #drawer button.wide { grid-column: 1 / -1; background: rgba(34,227,255,0.14); }

  @media (max-width: 1100px) {
    #links, #vertical-tag { display: none; }
    #weather { right: 190px; }
  }
  @media (max-width: 860px) {
    #weather, #clock, #disk { display: none; }
    #rail-left { top: 40px; }
  }
</style>

<div id="scene">

    <h3>TIZIM</h3>

  <!-- Disk (havoladagi o'ng yuqori DISK bloki) -->
  <div class="blk" id="disk">
    <h3 style="text-align:right">DISK</h3>
    <div><b id="disk-used">—</b> band</div>

  <!-- Soat (havoladagi 11:33 chizig'i) -->

  <!-- Papkalar (havoladagi Downloads/Documents qatori) -->
  <div class="blk" id="folders">
    <div class="chip" data-folder="downloads">Yuklamalar</div>
    <div class="chip" data-folder="documents">Hujjatlar</div>
    <div class="chip" data-folder="pictures">Rasmlar</div>
    <div class="chip" data-folder="music">Musiqa</div>
    <div class="chip" data-folder="videos">Videolar</div>

  <!-- Suhbat matni -->

  <!-- Emblema bosilganda: bo'g'in siferblatlari -->

  <!-- Demo boshqaruvi -->

<script>
/* --- ui/renderer/ dan aynan ko'chirilgan modullar --- */
// ---- palette.js ----
// Ranglar — bitta joyda.
//
// Iron Man HUD'ining rangi "dasturchi ko'ki" emas: u feruza-siyon, qora ustida
// yonib turadi va markazi oq-issiq. Farq shundaki, ko'k (#3B82F6) rang doirasida
// ~217° da yotadi, siyon esa ~187° da — va u har doim to'liq to'yingan.
// Shu farq butun ko'rinishni belgilaydi.

const P = (() => {
  const RGB = {
    cyan: [34, 227, 255],     // #22E3FF — asosiy chiziqlar
    cyanDeep: [0, 150, 196],  // chuqurroq soya, gradientlar uchun
    white: [236, 253, 255],   // oq-issiq yadro va yozuvlar
    amber: [255, 178, 62],    // ogohlantirish
    red: [255, 68, 58],       // nosozlik
    slate: [96, 126, 140],    // hali ishlatilmagan / o'chiq
  };

  // Ikki rang orasidagi oraliq — holat o'zgarganda rang sakramasin.
  function mix(a, b, t) {
    const A = RGB[a];
    const B = RGB[b];
    const k = Math.max(0, Math.min(1, t));
    return [
      Math.round(A[0] + (B[0] - A[0]) * k),
      Math.round(A[1] + (B[1] - A[1]) * k),
      Math.round(A[2] + (B[2] - A[2]) * k),
    ];
  }

  function toCss(color, alpha = 1) {
    const [r, g, b] = color;
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  // Bo'g'in holati -> rang. Siferblatlar shu jadval bo'yicha bo'yaladi.
  const STATUS_COLOR = {
    unknown: "slate",
    ready: "cyan",
    active: "white",
    warn: "amber",
    down: "red",
  };

  // Jarvis holati -> harakat xarakteri. Rang deyarli har doim siyon bo'lib
  // qoladi; faqat tasdiq va xato uni sariq/qizilga suradi.
  //   glow — umumiy yorqinlik, spin — yoylar tezligi,
  //   core — yadro yorqinligi, mark — JARVIS yozuvining ko'rinishi
  const STATE_MOOD = {
    idle:      { tint: "cyan",  blend: 0.00, glow: 0.38, spin: 0.14, core: 0.38, mark: 0.42 },
    wake:      { tint: "white", blend: 0.30, glow: 1.00, spin: 1.70, core: 1.00, mark: 1.00 },
    listening: { tint: "cyan",  blend: 0.25, glow: 0.78, spin: 0.44, core: 0.66, mark: 0.85 },
    thinking:  { tint: "cyan",  blend: 0.10, glow: 0.66, spin: 1.45, core: 0.50, mark: 0.60 },
    speaking:  { tint: "white", blend: 0.18, glow: 0.90, spin: 0.32, core: 0.80, mark: 0.95 },
    confirm:   { tint: "amber", blend: 0.90, glow: 0.86, spin: 0.20, core: 0.70, mark: 0.75 },
    error:     { tint: "red",   blend: 0.90, glow: 0.88, spin: 0.14, core: 0.72, mark: 0.70 },
  };

  return { RGB, mix, toCss, STATUS_COLOR, STATE_MOOD };
})();

// ---- suit.js ----
// Zirh chizmasi — ish stoli markazidagi figura.
//
// Simli (wireframe) uslubda chizilgan zirhli byust: dubulg'a, yelka
// qalqonlari, ko'krak va reaktor. Chiziqlar siyon, ayrim qirralar qizil
// urg'u bilan — havoladagi chizmadagidek. Hammasi 400x540 dizayn
// fazosida belgilangan, chapki yarmi o'ngga ko'zgu qilinadi.
//
// Jonli qismlari:
//   eyes  (0..1) — ko'zlar yorqinligi: «Hey Jarvis» deganda chaqnaydi
//   surge (0..1) — reaktor kuchayishi: gapirganda/uyg'onganda
//   t             — vaqt: reaktor segmentlari va nafas olish

const SUIT = (() => {
  const TAU = Math.PI * 2;
  const DW = 400; // dizayn fazosi kengligi
  const DCX = 200;

  // --- Chiziqlar: chap yarim (ko'zgu qilinadi) ---
  // pts — nuqtalar, w — qalinlik, a — shaffoflik,
  // red — qizil urg'u, close — yopiq kontur, curve — silliq egri
  const HALF = [
    // Dubulg'a tashqi konturi — kvadratroq, jag' tomon torayadi
    { pts: [[200,32],[176,35],[162,50],[155,74],[153,100],[155,124],[160,144],[168,158],[180,168],[192,173],[200,174]], curve: true, w: 2.2, a: 0.95 },
    // Yuz plastinasi ichki chizig'i
    { pts: [[200,46],[179,50],[167,63],[163,83],[163,105],[166,126],[173,144],[182,152]], curve: true, w: 1.1, a: 0.4 },
    // Quloq diski
    { pts: [[151,96],[146,104],[147,114],[153,120]], curve: true, w: 1.4, a: 0.6 },
    // Qosh plastinasi — V shaklida
    { pts: [[163,90],[187,82],[200,88]], w: 2.4, a: 0.95 },
    { pts: [[166,76],[200,72]], w: 1.2, a: 0.45 },
    // Yonoq paneli — ko'z ostidan og'iz tomon
    { pts: [[165,112],[172,132],[182,142],[189,147]], curve: true, w: 1.2, a: 0.55 },
    // Yonoq vertikal choki
    { pts: [[189,147],[189,159]], w: 1.2, a: 0.55 },
    // Jag' choki
    { pts: [[158,122],[163,143],[172,156]], curve: true, w: 1.0, a: 0.35 },
    // Bo'yin
    { pts: [[182,175],[176,198]], w: 1.5, a: 0.7 },
    // Yoqa yon tomoni
    { pts: [[148,202],[138,222]], w: 1.5, a: 0.8 },
    // Yelka qalqoni — baland va keng
    { pts: [[138,206],[96,197],[62,205],[40,225],[30,249],[28,277],[32,302]], curve: true, w: 2.2, a: 0.92 },
    // Yelka qalqoni — ichki chok
    { pts: [[138,220],[100,215],[72,227],[56,247],[52,274]], curve: true, w: 1.1, a: 0.45 },
    // Yelka qirrasi — qizil urg'u
    { pts: [[30,284],[70,294]], w: 1.5, a: 0.6, red: true },
    // Qo'l — tashqi
    { pts: [[32,304],[36,352],[40,392]], curve: true, w: 1.8, a: 0.8 },
    // Qo'l — ichki
    { pts: [[74,302],[78,348],[80,386]], curve: true, w: 1.1, a: 0.45 },
    // Bilaguzuk chizig'i
    { pts: [[38,356],[80,350]], w: 1.1, a: 0.45 },
    // Ko'krak plastinasi
    { pts: [[146,224],[198,224],[198,246],[192,284],[154,274],[146,250]], close: true, w: 1.6, a: 0.85 },
    // Ko'krak osti — qizil urg'u
    { pts: [[154,276],[190,286]], w: 1.6, a: 0.65, red: true },
    // Yon qiyshiq chok — qizil urg'u
    { pts: [[148,292],[162,346]], w: 1.4, a: 0.5, red: true },
    // Qorin yon tomoni
    { pts: [[152,284],[158,318],[162,356],[170,398],[176,428]], curve: true, w: 1.6, a: 0.8 },
    // Bel plastinasi diagonali
    { pts: [[166,366],[186,402]], w: 1.0, a: 0.3 },
  ];

  // --- To'liq (ko'zgusiz) chiziqlar ---
  const FULL = [
    // Yoqa
    { pts: [[148,202],[252,202]], w: 1.5, a: 0.8 },
    { pts: [[138,222],[262,222]], w: 1.5, a: 0.8 },
    // Og'iz tirqishi
    { pts: [[189,151],[211,151]], w: 2.2, a: 0.85 },
    // Iyak osti chizig'i
    { pts: [[191,163],[209,163]], w: 1.1, a: 0.45 },
    // Qorin choklari
    { pts: [[164,324],[200,330],[236,324]], curve: true, w: 1.1, a: 0.45 },
    { pts: [[168,356],[200,362],[232,356]], curve: true, w: 1.1, a: 0.45 },
    { pts: [[174,392],[200,398],[226,392]], curve: true, w: 1.1, a: 0.45 },
    // Ko'krak markaziy choki
    { pts: [[200,224],[200,254]], w: 1.1, a: 0.45 },
    // Pastki qirra
    { pts: [[180,430],[200,436],[220,430]], curve: true, w: 1.4, a: 0.55 },
  ];

  // Ko'z tirqishi: chap (ko'zgu qilinadi)
  // Ko'z tirqishi burchaklari (chap): tashqi tomoni biroz yuqoriroq
  const EYE = { pts: [[166,97],[190,95],[190,103],[166,106]] };

  const REACTOR = { x: 200, y: 288, r: 24 };

  function path(ctx, pts, sx, sy, curve, close, mirror) {
    const X = (p) => sx(mirror ? DW - p[0] : p[0]);
    ctx.beginPath();
    ctx.moveTo(X(pts[0]), sy(pts[0][1]));
    if (curve && pts.length > 2) {
      // Nuqtalar orasini o'rta nuqtalar orqali silliqlash
      for (let i = 1; i < pts.length - 1; i++) {
        const mx = (pts[i][0] + pts[i + 1][0]) / 2;
        const my = (pts[i][1] + pts[i + 1][1]) / 2;
        ctx.quadraticCurveTo(X(pts[i]), sy(pts[i][1]), sx(mirror ? DW - mx : mx), sy(my));
      }
      const last = pts[pts.length - 1];
      ctx.lineTo(X(last), sy(last[1]));
    } else {
      for (let i = 1; i < pts.length; i++) ctx.lineTo(X(pts[i]), sy(pts[i][1]));
    }
    if (close) ctx.closePath();
    ctx.stroke();
  }

  function drawEye(ctx, sx, sy, s, eyes, mirror) {
    const X = (p) => sx(mirror ? DW - p[0] : p[0]);
    ctx.save();
    ctx.shadowColor = P.toCss(P.RGB.cyan, 0.95);
    ctx.shadowBlur = (6 + eyes * 28) * s;

    const c = EYE.pts;
    const g = ctx.createLinearGradient(X(c[0]), sy(c[0][1]), X(c[1]), sy(c[1][1]));
    g.addColorStop(0, P.toCss(P.RGB.cyan, 0.55 + eyes * 0.45));
    g.addColorStop(0.5, P.toCss(P.RGB.white, 0.65 + eyes * 0.35));
    g.addColorStop(1, P.toCss(P.RGB.cyan, 0.55 + eyes * 0.45));
    ctx.fillStyle = g;

    ctx.beginPath();
    ctx.moveTo(X(c[0]), sy(c[0][1]));
    for (let i = 1; i < c.length; i++) ctx.lineTo(X(c[i]), sy(c[i][1]));
    ctx.closePath();
    ctx.fill();
    // Ikkinchi qatlam — markaz oq-issiq bo'lsin
    ctx.fill();
    ctx.restore();
  }

  function drawReactor(ctx, sx, sy, s, t, surge) {
    const x = sx(REACTOR.x);
    const y = sy(REACTOR.y);
    const r = REACTOR.r * s;
    const bright = 0.55 + surge * 0.45;

    // Nur
    const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 2.2);
    glow.addColorStop(0, P.toCss(P.RGB.white, 0.5 * bright));
    glow.addColorStop(0.35, P.toCss(P.RGB.cyan, 0.28 * bright));
    glow.addColorStop(1, P.toCss(P.RGB.cyan, 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, r * 2.2, 0, TAU);
    ctx.fill();

    // Tashqi va ichki halqa
    for (const [k, w, a] of [[1, 2, 0.95], [0.42, 1.2, 0.8]]) {
      ctx.beginPath();
      ctx.arc(x, y, r * k, 0, TAU);
      ctx.strokeStyle = P.toCss(P.RGB.cyan, a * bright);
      ctx.lineWidth = w * s;
      ctx.stroke();
    }

    // Aylanuvchi segmentlar — reaktorning "tirik" qismi
    const spin = t * (0.5 + surge * 1.6);
    ctx.lineWidth = Math.max(2.5 * s, 2);
    for (let i = 0; i < 10; i++) {
      const a0 = spin + (i / 10) * TAU;
      ctx.beginPath();
      ctx.arc(x, y, r * 0.72, a0, a0 + 0.38);
      ctx.strokeStyle = P.toCss(P.RGB.white, (0.35 + surge * 0.55) * (i % 2 ? 0.6 : 1));
      ctx.stroke();
    }

    // Markaziy nuqta
    ctx.beginPath();
    ctx.arc(x, y, r * 0.2, 0, TAU);
    ctx.fillStyle = P.toCss(P.RGB.white, 0.85 + surge * 0.15);
    ctx.fill();
  }

  /**
   * Zirh byustini chizadi.
   * @param {object} o — {cx, topY, height, t, eyes, surge}
   *   cx — markaz X; topY — dubulg'a tepasi Y; height — byust balandligi
   */
  function draw(ctx, o) {
    const s = o.height / 540;
    const left = o.cx - DCX * s;
    const sx = (x) => left + x * s;
    const sy = (y) => o.topY + y * s;

    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // Nafas olish — butun figura juda sekin "tirik" turadi
    const breathe = 1 + Math.sin(o.t * 0.9) * 0.012;

    for (const mirror of [false, true]) {
      for (const line of HALF) {
        const color = line.red ? P.RGB.red : P.RGB.cyan;
        ctx.strokeStyle = P.toCss(color, line.a * breathe * (line.red ? 0.9 : 1));
        ctx.lineWidth = line.w * s;
        path(ctx, line.pts, sx, sy, line.curve, line.close, mirror);
      }
    }
    for (const line of FULL) {
      ctx.strokeStyle = P.toCss(P.RGB.cyan, line.a * breathe);
      ctx.lineWidth = line.w * s;
      path(ctx, line.pts, sx, sy, line.curve, line.close, false);
    }

    drawEye(ctx, sx, sy, s, o.eyes, false);
    drawEye(ctx, sx, sy, s, o.eyes, true);
    drawReactor(ctx, sx, sy, s, o.t, o.surge);

    ctx.restore();
  }

  // Reaktor markazining ekran koordinatasi — orqa halqalarni shu yerga qo'yish uchun
  function reactorAt(o) {
    const s = o.height / 540;
    return { x: o.cx, y: o.topY + REACTOR.y * s };
  }

  return { draw, reactorAt };
})();

// ---- hud.js ----
// HUD chizuvchi — Jarvis'ning ko'rinadigan yuzi.
//
// Tuzilishi markazdan tashqariga qarab:
//
//   0.00–0.34  yadro (reaktor) va JARVIS yozuvi — asosiy ikonka
//   0.44       ovoz to'lqini — gapirganda va tinglaganda jonlanadi
//   0.52–0.66  chizma yoylari — turli tezlikda aylanadi
//   0.75       bo'g'in siferblatlari — har biri bitta tizimga bog'langan
//   0.88       siferblat yozuvlari — gorizontal oq matn
//   0.94–1.00  chekka: darajali bo'linmalar, burchak qavslari, radar chizig'i
//
// Asosiy g'oya: har bir siferblat tirik ko'rsatkich. Aylanayotgani — o'sha
// bo'g'in ishlayapti; tezroq aylanishi — hozir ish bajaryapti; qizarishi va
// to'xtashi — buzilgan. Ekranga bir qarabroq qayerda muammo borligi ko'rinadi.

const HUD = (() => {
  const TAU = Math.PI * 2;

  // ---------------------------------------------------------------- geometriya

  const RING = {
    core: 0.34,
    wave: 0.44,
    blueprint: [0.52, 0.59, 0.66],
    dials: 0.75,
    labels: 0.88,
    ticks: 0.94,
    edge: 1.0,
  };

  const DIAL_RADIUS = 0.075; // R ga nisbatan
  const TICK_COUNT = 72;
  const WAVE_BARS = 72;
  const MOTE_COUNT = 34;

  // Chizma yoylari — Iron Man chizmalaridagi konsentrik detallar.
  // Qarama-qarshi yo'nalishdagi tezliklar "mexanizm" hissini beradi.
  const ARCS = [
    { ring: 0, start: 0.00, sweep: 1.30, speed: 0.55, width: 1.6, alpha: 0.78 },
    { ring: 0, start: 3.35, sweep: 0.75, speed: 0.55, width: 1.6, alpha: 0.50 },
    { ring: 1, start: 1.60, sweep: 2.20, speed: -0.33, width: 2.4, alpha: 0.70 },
    { ring: 1, start: 4.60, sweep: 0.50, speed: -0.33, width: 2.4, alpha: 0.42 },
    { ring: 2, start: 4.20, sweep: 1.10, speed: 0.88, width: 1.3, alpha: 0.62 },
    { ring: 2, start: 0.90, sweep: 0.35, speed: 0.88, width: 1.3, alpha: 0.40 },
  ];

  const BRACKETS = [0, Math.PI / 2, Math.PI, Math.PI * 1.5];

  // Suzuvchi zarrachalar — bo'shliqni to'ldiradi, hajm beradi.
  const MOTES = Array.from({ length: MOTE_COUNT }, (_, i) => ({
    angle: (i / MOTE_COUNT) * TAU + Math.random(),
    radius: 0.40 + Math.random() * 0.48,
    speed: (Math.random() - 0.5) * 0.14,
    size: 0.5 + Math.random() * 1.2,
    phase: Math.random() * TAU,
  }));

  // ---------------------------------------------------------------- yordamchi

  function ringColor(status) {
    return P.RGB[P.STATUS_COLOR[status] || "slate"];
  }

  // Siferblat yozuvi — gorizontal, halqa bo'ylab egilgan emas.
  //
  // Egilgan matn chiroyli ko'rinadi, lekin o'ng va chap chekkada harflar
  // vertikal bo'lib qolib o'qilmaydi. Muammoni yozuvni gorizontal qoldirib,
  // faqat tayanch nuqtasini almashtirib hal qilamiz: o'ng yarimda matn
  // o'ngga, chap yarimda chapga o'sadi — shunda u hech qachon kadrdan
  // chiqib ketmaydi.
  function drawLabel(ctx, text, cx, cy, radius, angle, size, color, bounds) {
    const cos = Math.cos(angle);
    const y = cy + Math.sin(angle) * radius;

    ctx.save();
    ctx.font = `700 ${size}px ui-sans-serif, -apple-system, system-ui, sans-serif`;
    if ("letterSpacing" in ctx) ctx.letterSpacing = `${size * 0.11}px`;
    const align = cos > 0.25 ? "left" : cos < -0.25 ? "right" : "center";
    ctx.textAlign = align;
    ctx.textBaseline = "middle";

    // Kadr chetiga tegib qolgan yozuv kesiladi ("ASBOB" -> "SBOB"), shuning
    // uchun tayanch nuqtasini o'lchab ichkariga suramiz. Halqadan biroz
    // chekinish uzun yozuvni yo'qotib qo'yishdan afzal.
    const w = ctx.measureText(text).width;
    const pad = 3;
    let x = cx + cos * radius;
    if (align === "left") x = Math.min(x, bounds - pad - w);
    else if (align === "right") x = Math.max(x, pad + w);
    else x = Math.min(Math.max(x, pad + w / 2), bounds - pad - w / 2);

    ctx.fillStyle = color;
    // Qora fonda ingichka oq harflar yo'qolmasin
    ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
    ctx.shadowBlur = 4;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  // ---------------------------------------------------------------- qatlamlar

  function drawGlow(ctx, cx, cy, R, tint, intensity) {
    const g = ctx.createRadialGradient(cx, cy, R * 0.06, cx, cy, R);
    g.addColorStop(0, P.toCss(tint, 0.22 * intensity));
    g.addColorStop(0.45, P.toCss(tint, 0.07 * intensity));
    g.addColorStop(1, P.toCss(tint, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, TAU);
    ctx.fill();
  }

  function drawMotes(ctx, cx, cy, R, t, tint, intensity) {
    for (const m of MOTES) {
      const angle = m.angle + t * m.speed;
      const r = R * (m.radius + Math.sin(t * 0.7 + m.phase) * 0.025);
      const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(t * 1.3 + m.phase));
      ctx.beginPath();
      ctx.arc(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r, m.size, 0, TAU);
      ctx.fillStyle = P.toCss(tint, 0.3 * twinkle * intensity);
      ctx.fill();
    }
  }

  function drawTicks(ctx, cx, cy, R, t, tint, intensity) {
    const outer = R * RING.edge;
    for (let i = 0; i < TICK_COUNT; i++) {
      const angle = (i / TICK_COUNT) * TAU;
      const major = i % 6 === 0;
      const wave = 0.55 + 0.45 * Math.sin(t * 1.8 - i * 0.22);
      const len = (major ? 9 : 4) * (major ? 1 : wave);
      const inner = outer - len;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner);
      ctx.lineTo(cx + Math.cos(angle) * outer, cy + Math.sin(angle) * outer);
      ctx.strokeStyle = P.toCss(tint, (major ? 0.72 : 0.3 * wave) * intensity);
      ctx.lineWidth = major ? 1.6 : 1;
      ctx.stroke();
    }
  }

  function drawBrackets(ctx, cx, cy, R, t, tint, intensity) {
    const r = R * 0.97;
    const spin = -t * 0.12;
    ctx.strokeStyle = P.toCss(tint, 0.65 * intensity);
    ctx.lineWidth = 2.2;
    for (const offset of BRACKETS) {
      const a = spin + offset;
      ctx.beginPath();
      ctx.arc(cx, cy, r, a - 0.17, a + 0.17);
      ctx.stroke();
      for (const end of [a - 0.17, a + 0.17]) {
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(end) * r, cy + Math.sin(end) * r);
        ctx.lineTo(cx + Math.cos(end) * (r - 8), cy + Math.sin(end) * (r - 8));
        ctx.stroke();
      }
    }
  }

  // Radar chizig'i — butun tizim tirikligining yagona umumiy belgisi.
  function drawSweep(ctx, cx, cy, R, t, tint, intensity) {
    const angle = t * 0.5;
    const r = R * RING.ticks;
    // Markazdan emas, yadro chekkasidan — aks holda chiziq JARVIS yozuvini kesadi
    const from = R * RING.blueprint[0];
    const x0 = cx + Math.cos(angle) * from;
    const y0 = cy + Math.sin(angle) * from;
    const x1 = cx + Math.cos(angle) * r;
    const y1 = cy + Math.sin(angle) * r;

    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, P.toCss(tint, 0));
    g.addColorStop(1, P.toCss(tint, 0.55 * intensity));
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();

    // Chiziq ortidan qolgan xira iz
    ctx.beginPath();
    ctx.arc(cx, cy, r, angle - 0.55, angle);
    ctx.strokeStyle = P.toCss(tint, 0.14 * intensity);
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  function drawArcs(ctx, cx, cy, R, t, spin, tint, intensity) {
    for (const arc of ARCS) {
      const r = R * RING.blueprint[arc.ring];
      const from = arc.start + t * arc.speed * spin;
      ctx.beginPath();
      ctx.arc(cx, cy, r, from, from + arc.sweep);
      ctx.strokeStyle = P.toCss(tint, arc.alpha * intensity);
      ctx.lineWidth = arc.width;
      ctx.stroke();
    }
    // Yoylar orasidagi uzuq halqa
    ctx.setLineDash([2, 7]);
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.585, 0, TAU);
    ctx.strokeStyle = P.toCss(tint, 0.38 * intensity);
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Bo'g'in siferblatlari — HUD'ning ma'no jihatidan eng muhim qismi.
  function drawDials(ctx, cx, cy, R, t, systems, intensity, width) {
    if (!systems.length) return;
    const ringR = R * RING.dials;
    const dialR = R * DIAL_RADIUS;

    systems.forEach((sys, i) => {
      // Tepadan boshlab soat yo'nalishida
      const angle = -Math.PI / 2 + (i / systems.length) * TAU;
      const x = cx + Math.cos(angle) * ringR;
      const y = cy + Math.sin(angle) * ringR;
      const color = ringColor(sys.status);
      const down = sys.status === "down";
      const heat = sys.heat || 0;
      const alive = !down && sys.status !== "unknown";

      // Tashqi halqa
      ctx.beginPath();
      ctx.arc(x, y, dialR, 0, TAU);
      ctx.strokeStyle = P.toCss(color, (down ? 1 : 0.58 + heat * 0.42) * intensity);
      ctx.lineWidth = down ? 1.8 : 1.2;
      ctx.stroke();

      // Ichki aylanuvchi yoy: ish bo'lganda tezlashadi.
      // Buzilgan bo'g'in aylanmaydi — to'xtagan siferblat darhol ko'zga tashlanadi.
      if (alive) {
        const speed = 0.6 + heat * 4.5;
        const from = t * speed + i * 1.7;
        ctx.beginPath();
        ctx.arc(x, y, dialR * 0.62, from, from + 1.5 + heat * 1.6);
        ctx.strokeStyle = P.toCss(color, (0.78 + heat * 0.22) * intensity);
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // Markaziy nuqta — issiqlikka qarab yorqinlashadi
      ctx.beginPath();
      ctx.arc(x, y, 1.8 + heat * 1.6, 0, TAU);
      ctx.fillStyle = P.toCss(color, (0.6 + heat * 0.4) * intensity);
      ctx.fill();

      // Nosozlik belgisi — siferblat ustidan kesib o'tuvchi chiziq
      if (down) {
        const d = dialR * 0.48;
        ctx.strokeStyle = P.toCss(color, 0.95 * intensity);
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(x - d, y - d);
        ctx.lineTo(x + d, y + d);
        ctx.moveTo(x + d, y - d);
        ctx.lineTo(x - d, y + d);
        ctx.stroke();
      }

      // Siferblatdan yozuvga bog'lovchi chiziq va uchidagi nuqta
      const from = ringR + dialR + 2;
      const to = R * RING.labels - 5;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(angle) * from, cy + Math.sin(angle) * from);
      ctx.lineTo(cx + Math.cos(angle) * to, cy + Math.sin(angle) * to);
      ctx.strokeStyle = P.toCss(color, (down ? 0.7 : 0.42) * intensity);
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx + Math.cos(angle) * to, cy + Math.sin(angle) * to, 1.6, 0, TAU);
      ctx.fillStyle = P.toCss(color, (down ? 0.9 : 0.6) * intensity);
      ctx.fill();

      const labelAlpha = down ? 1 : sys.status === "unknown" ? 0.4 : 0.8 + heat * 0.2;
      const labelColor = down || sys.status === "warn" ? color : P.RGB.white;
      drawLabel(
        ctx, sys.label, cx, cy, R * RING.labels, angle,
        Math.max(8, R * 0.046), P.toCss(labelColor, labelAlpha * intensity), width,
      );
    });
  }

  function drawWave(ctx, cx, cy, R, t, level, tint, intensity) {
    const base = R * RING.wave;
    ctx.beginPath();
    for (let i = 0; i <= WAVE_BARS; i++) {
      const angle = (i / WAVE_BARS) * TAU;
      // Ikki xil chastota — jonli, takrorlanmaydigan to'lqin
      const ripple =
        Math.sin(angle * 3 + t * 2.4) * 0.6 + Math.sin(angle * 6 - t * 1.7) * 0.4;
      const r = base + ripple * level * R * 0.085;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = P.toCss(tint, (0.45 + level * 0.5) * intensity);
    ctx.lineWidth = 1.8;
    ctx.stroke();
  }

  function drawCore(ctx, cx, cy, R, t, coreLevel, tint, intensity) {
    const r = R * RING.core;

    // Oq-issiq markaz — reaktor
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, P.toCss(P.RGB.white, 0.95 * coreLevel * intensity));
    g.addColorStop(0.35, P.toCss(tint, 0.5 * coreLevel * intensity));
    g.addColorStop(1, P.toCss(tint, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, TAU);
    ctx.fill();

    // Konsentrik halqalar
    for (const [k, alpha, width] of [[0.32, 0.8, 1.6], [0.25, 0.5, 1.1], [0.17, 0.95, 1.8]]) {
      ctx.beginPath();
      ctx.arc(cx, cy, R * k, 0, TAU);
      ctx.strokeStyle = P.toCss(tint, alpha * intensity);
      ctx.lineWidth = width;
      ctx.stroke();
    }

    // Yadro atrofidagi aylanuvchi segmentlar
    for (let i = 0; i < 8; i++) {
      const a = t * 0.4 + (i / 8) * TAU;
      ctx.beginPath();
      ctx.arc(cx, cy, R * 0.30, a, a + 0.28);
      ctx.strokeStyle = P.toCss(P.RGB.white, 0.28 * coreLevel * intensity);
      ctx.lineWidth = 2.4;
      ctx.stroke();
    }
  }

  // JARVIS yozuvi — asosiy ikonka. Uyg'onganda yorqinlashadi va biroz kattalashadi.
  function drawWordmark(ctx, cx, cy, R, mark, intensity, pulse) {
    const size = R * 0.132 * (1 + pulse * 0.05);
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `800 ${size}px ui-sans-serif, -apple-system, "SF Pro Display", system-ui, sans-serif`;
    if ("letterSpacing" in ctx) ctx.letterSpacing = `${size * 0.16}px`;

    const alpha = Math.min(1, (0.55 + mark * 0.45) * intensity);

    // Siyon nur — yozuv orqasidan yonib turadi. Uch qatlam: keng nur,
    // tor nur, so'ng toza oq harflar. Bitta qatlam qora fonda xira chiqadi.
    ctx.shadowColor = P.toCss(P.RGB.cyan, 0.95);
    ctx.shadowBlur = 26 * mark + 10;
    ctx.fillStyle = P.toCss(P.RGB.white, alpha * 0.85);
    ctx.fillText("JARVIS", cx, cy);

    ctx.shadowBlur = 10 * mark + 4;
    ctx.fillStyle = P.toCss(P.RGB.white, alpha);
    ctx.fillText("JARVIS", cx, cy);

    ctx.shadowBlur = 0;
    ctx.fillStyle = P.toCss(P.RGB.white, alpha);
    ctx.fillText("JARVIS", cx, cy);
    ctx.restore();
  }

  // ---------------------------------------------------------------- umumiy chizish

  /**
   * Bir kadr chizadi.
   *
   * @param {CanvasRenderingContext2D} ctx
   * @param {object} f — kadr ma'lumotlari:
   *   width, height, t (soniya), state, level (0..1), flash (0..1),
   *   systems: [{id, label, status, heat}]
   */
  function draw(ctx, f) {
    const { width: W, height: H } = f;
    ctx.clearRect(0, 0, W, H);

    const cx = W / 2;
    const cy = H / 2;
    const R = Math.min(W, H) / 2 - 6;

    const mood = P.STATE_MOOD[f.state] || P.STATE_MOOD.idle;
    const tint = P.mix("cyan", mood.tint, mood.blend);
    const t = f.t;

    // Chaqnash va nafas — umumiy yorqinlik
    const breath = 1 + Math.sin(t * 1.5) * 0.05 * mood.glow;
    const intensity = Math.min(1.7, (0.82 + mood.glow * 0.55) * breath + f.flash * 0.45);
    const pulse = (Math.sin(t * 2.2) + 1) / 2;

    // Nosozlik bo'lsa, chekka qizg'ish tus oladi — muammo periferiyada ko'rinadi
    const broken = (f.systems || []).some((s) => s.status === "down");
    const edgeTint = broken ? P.mix("cyan", "red", 0.7) : tint;

    ctx.lineCap = "round";

    drawGlow(ctx, cx, cy, R, tint, intensity);
    drawMotes(ctx, cx, cy, R, t, tint, intensity);
    drawSweep(ctx, cx, cy, R, t, edgeTint, intensity);
    drawTicks(ctx, cx, cy, R, t, edgeTint, intensity);
    drawBrackets(ctx, cx, cy, R, t, edgeTint, intensity);
    drawDials(ctx, cx, cy, R, t, f.systems || [], intensity, W);
    drawArcs(ctx, cx, cy, R, t, mood.spin, tint, intensity);
    drawWave(ctx, cx, cy, R, t, f.level, tint, intensity);
    drawCore(ctx, cx, cy, R, t, mood.core + f.flash * 0.35, tint, intensity);
    drawWordmark(ctx, cx, cy, R, Math.min(1, mood.mark + f.flash), intensity, pulse);
  }

  return { draw, RING };
})();

// ---- desktop.js ----

//
// Havoladagi Rainmeter uslubida: markazda zirh chizmasi (SUIT), orqasida
// aylanuvchi halqalar, chetlarda shesternyalar, o'ngda sariq ovoz datchigi
// va tizim o'lchagichi, chap pastda dumaloq JARVIS emblemasi.
//
// Bu fayl faqat chizadi — ma'lumotni (holat, ovoz darajasi, CPU/RAM)
// chaqiruvchi beradi. DOM elementlari (ilova tugmalari, ob-havo, soat)
// sahifaning o'zida, bu yerda faqat grafika.

const DESK = (() => {
  const TAU = Math.PI * 2;

  // ------------------------------------------------------------- o'rnatilgan rasm

      { rect: [0.385, 0.134, 0.055, 0.018], url: "https://google.com",    title: "Google" },

      { rect: [0.385, 0.168, 0.055, 0.018], url: "https://facebook.com",  title: "Facebook" },
      { rect: [0.385, 0.184, 0.055, 0.018], url: "https://youtube.com",   title: "YouTube" },
      { rect: [0.385, 0.201, 0.055, 0.018], url: "https://imdb.com",      title: "IMDB" },
      { rect: [0.385, 0.298, 0.055, 0.018], url: "https://yahoo.com",     title: "Yahoo" },
      { rect: [0.385, 0.331, 0.055, 0.018], url: "https://wikipedia.org", title: "Wikipedia" },

      { rect: [0.752, 0.764, 0.057, 0.026], folder: "downloads", title: "Yuklamalar" },
      { rect: [0.767, 0.796, 0.057, 0.026], folder: "documents", title: "Hujjatlar" },
      { rect: [0.786, 0.826, 0.057, 0.026], folder: "music",     title: "Musiqa" },
      { rect: [0.828, 0.839, 0.057, 0.026], folder: "desktop",   title: "Ish stoli" },
      { rect: [0.901, 0.764, 0.057, 0.026], folder: "documents", title: "Hujjatlar" },
      { rect: [0.887, 0.795, 0.057, 0.026], folder: "pictures",  title: "Rasmlar" },
      { rect: [0.868, 0.826, 0.057, 0.026], folder: "videos",    title: "Videolar" },

      // Reaktor — bosilsa Jarvis uyg'onadi
      { circle: [0.501, 0.713, 0.055], activate: true, title: "Jarvis'ni chaqirish" },
    ],
  };

  const METER_SLOTS = 18; // ovoz datchigi segmentlari

  // Suzuvchi zarrachalar — butun ekran bo'ylab siyrak
  const MOTES = Array.from({ length: 42 }, () => ({
    x: Math.random(),
    y: Math.random(),
    drift: 0.004 + Math.random() * 0.01,
    phase: Math.random() * TAU,
    size: 0.5 + Math.random() * 1.3,
  }));

  let peakHold = 0; // datchik cho'qqi chizig'i sekin tushadi

  // ------------------------------------------------------------- fon

  function drawGrid(ctx, W, H) {
    const step = 48;
    ctx.strokeStyle = P.toCss(P.RGB.cyan, 0.035);
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = step; x < W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = step; y < H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();

    // Har to'rtinchi kesishmada kichik xoch — chizma qog'ozi hissi
    ctx.strokeStyle = P.toCss(P.RGB.cyan, 0.08);
    ctx.beginPath();
    for (let x = step * 4; x < W; x += step * 4) {
      for (let y = step * 4; y < H; y += step * 4) {
        ctx.moveTo(x - 4, y); ctx.lineTo(x + 4, y);
        ctx.moveTo(x, y - 4); ctx.lineTo(x, y + 4);
      }
    }
    ctx.stroke();
  }

  function drawMotes(ctx, W, H, t) {
    for (const m of MOTES) {
      const y = (m.y + t * m.drift) % 1;
      const tw = 0.3 + 0.7 * Math.abs(Math.sin(t * 0.9 + m.phase));
      ctx.beginPath();
      ctx.arc(m.x * W, y * H, m.size, 0, TAU);
      ctx.fillStyle = P.toCss(P.RGB.cyan, 0.10 * tw);
      ctx.fill();
    }
  }

  // ------------------------------------------------------------- halqalar

  // Zirh orqasidagi katta aylanuvchi chizma halqalari
  function drawRings(ctx, cx, cy, R, t, energy) {
    // Belgili halqa
    const spin = t * 0.06;
    ctx.strokeStyle = P.toCss(P.RGB.cyan, 0.22);
    ctx.lineWidth = 1;
    for (let i = 0; i < 90; i++) {
      const a = spin + (i / 90) * TAU;
      const major = i % 15 === 0;
      const r0 = R * (major ? 0.955 : 0.975);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, TAU);
    ctx.strokeStyle = P.toCss(P.RGB.cyan, 0.18);
    ctx.stroke();

    // Uzuq ichki halqa — teskari aylanadi
    ctx.setLineDash([3, 9]);
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.88, -t * 0.1, -t * 0.1 + TAU);
    ctx.strokeStyle = P.toCss(P.RGB.cyan, 0.16);
    ctx.stroke();
    ctx.setLineDash([]);

    // Qisman yoylar — energiya bilan yorqinlashadi
    for (const [k, from, sweep, speed, w] of [
      [1.06, 0.4, 1.3, 0.22, 2], [1.06, 3.6, 0.6, 0.22, 2],
      [0.80, 2.0, 1.8, -0.15, 2.6], [0.72, 5.0, 0.9, 0.3, 1.4],
    ]) {
      const a = from + t * speed;
      ctx.beginPath();
      ctx.arc(cx, cy, R * k, a, a + sweep);
      ctx.strokeStyle = P.toCss(P.RGB.cyan, (0.25 + energy * 0.3));
      ctx.lineWidth = w;
      ctx.stroke();
    }
  }

  // ------------------------------------------------------------- shesternya

  function drawGear(ctx, cx, cy, r, teeth, rot, alpha) {
    const toothH = r * 0.16;
    ctx.strokeStyle = P.toCss(P.RGB.cyan, alpha);
    ctx.lineWidth = 1.2;

    // Tishli tashqi kontur
    ctx.beginPath();
    for (let i = 0; i < teeth; i++) {
      const a0 = rot + (i / teeth) * TAU;
      const a1 = rot + ((i + 0.38) / teeth) * TAU;
      const a2 = rot + ((i + 0.5) / teeth) * TAU;
      const a3 = rot + ((i + 0.88) / teeth) * TAU;
      const R1 = r + toothH;
      if (i === 0) ctx.moveTo(cx + Math.cos(a0) * R1, cy + Math.sin(a0) * R1);
      ctx.arc(cx, cy, R1, a0, a1);
      ctx.lineTo(cx + Math.cos(a2) * r, cy + Math.sin(a2) * r);
      ctx.arc(cx, cy, r, a2, a3);
      ctx.lineTo(cx + Math.cos(rot + ((i + 1) / teeth) * TAU) * R1,
                 cy + Math.sin(rot + ((i + 1) / teeth) * TAU) * R1);
    }
    ctx.closePath();
    ctx.stroke();

    // Ichki halqa va kesmalar
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.62, 0, TAU);
    ctx.stroke();
    for (let i = 0; i < 5; i++) {
      const a = rot + (i / 5) * TAU;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r * 0.2, cy + Math.sin(a) * r * 0.2);
      ctx.lineTo(cx + Math.cos(a) * r * 0.62, cy + Math.sin(a) * r * 0.62);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.2, 0, TAU);
    ctx.stroke();
  }

  // Bir-biriga "tishlashgan" shesternyalar guruhi
  function drawGearCluster(ctx, x, y, t, scale, alpha) {
    drawGear(ctx, x, y, 56 * scale, 14, t * 0.3, alpha);
    drawGear(ctx, x + 74 * scale, y + 48 * scale, 32 * scale, 10, -t * 0.3 * (56 / 32) + 0.16, alpha * 0.8);
    drawGear(ctx, x - 52 * scale, y + 66 * scale, 24 * scale, 8, -t * 0.3 * (56 / 24) + 0.3, alpha * 0.65);
  }

  // ------------------------------------------------------------- ovoz datchigi

  // Sariq (zargaldoq) vertikal ustun — ovoz darajasiga qarab ko'tarilib tushadi
  function drawVoiceMeter(ctx, x, yTop, height, level, active, t, barW = 36) {
    const slotH = height / METER_SLOTS;
    const lit = Math.round(level * METER_SLOTS);

    peakHold = Math.max(peakHold - 0.006, level);

    for (let i = 0; i < METER_SLOTS; i++) {
      const y = yTop + height - (i + 1) * slotH;
      const on = i < lit && active;
      // Yuqori segmentlar qizg'ishroq — klassik daraja o'lchagich
      const hot = i / METER_SLOTS;
      const color = hot > 0.82 ? P.RGB.red : P.RGB.amber;
      ctx.fillStyle = P.toCss(color, on ? 0.5 + hot * 0.5 : 0.07);
      ctx.fillRect(x, y + 2, barW, slotH - 4);
      if (on) {
        ctx.shadowColor = P.toCss(color, 0.8);
        ctx.shadowBlur = 8;
        ctx.fillRect(x, y + 2, barW, slotH - 4);
        ctx.shadowBlur = 0;
      }
    }

    // Cho'qqi chizig'i
    if (active && peakHold > 0.02) {
      const py = yTop + height - peakHold * height;
      ctx.fillStyle = P.toCss(P.RGB.white, 0.85);
      ctx.fillRect(x, py, barW, 2);
    }

    // Ramka burchaklari
    ctx.strokeStyle = P.toCss(P.RGB.amber, 0.5);
    ctx.lineWidth = 1.4;
    for (const [bx, by, dx, dy] of [
      [x - 5, yTop - 5, 10, 0], [x - 5, yTop - 5, 0, 10],
      [x + barW + 5, yTop - 5, -10, 0], [x + barW + 5, yTop - 5, 0, 10],
      [x - 5, yTop + height + 5, 10, 0], [x - 5, yTop + height + 5, 0, -10],
      [x + barW + 5, yTop + height + 5, -10, 0], [x + barW + 5, yTop + height + 5, 0, -10],
    ]) {
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(bx + dx, by + dy);
      ctx.stroke();
    }

    // Yozuv
    ctx.font = "700 10px ui-monospace, Menlo, monospace";
    ctx.textAlign = "center";
    ctx.fillStyle = P.toCss(P.RGB.amber, active ? 0.9 : 0.4);
    ctx.fillText("OVOZ", x + barW / 2, yTop + height + 24);
  }

  // ------------------------------------------------------------- tizim o'lchagichi

  // Dumaloq o'lchagich: CPU / RAM / DISK — uch konsentrik yoy
  function drawSystemGauge(ctx, cx, cy, r, stats, t) {
    const rows = [
      { key: "cpu", label: "CPU", color: P.RGB.cyan, k: 1.0 },
      { key: "ram", label: "RAM", color: P.RGB.amber, k: 0.78 },
      { key: "disk", label: "DISK", color: P.RGB.cyan, k: 0.56 },
    ];

    // Fon bo'linmalari
    ctx.strokeStyle = P.toCss(P.RGB.cyan, 0.15);
    ctx.lineWidth = 1;
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * TAU;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r * 1.06, cy + Math.sin(a) * r * 1.06);
      ctx.lineTo(cx + Math.cos(a) * r * 1.12, cy + Math.sin(a) * r * 1.12);
      ctx.stroke();
    }

    for (const row of rows) {
      const value = Math.max(0, Math.min(1, (stats && stats[row.key] || 0) / 100));
      const rr = r * row.k;
      // Fon yoyi
      ctx.beginPath();
      ctx.arc(cx, cy, rr, -Math.PI / 2, -Math.PI / 2 + TAU);
      ctx.strokeStyle = P.toCss(row.color, 0.12);
      ctx.lineWidth = 5;
      ctx.stroke();
      // Qiymat yoyi
      ctx.beginPath();
      ctx.arc(cx, cy, rr, -Math.PI / 2, -Math.PI / 2 + TAU * value);
      ctx.strokeStyle = P.toCss(row.color, 0.85);
      ctx.stroke();
    }

    // Markazda CPU foizi
    ctx.textAlign = "center";
    ctx.font = `700 ${Math.round(r * 0.42)}px ui-monospace, Menlo, monospace`;
    ctx.fillStyle = P.toCss(P.RGB.white, 0.9);
    ctx.fillText(`${Math.round(stats && stats.cpu || 0)}%`, cx, cy + r * 0.14);

    // Pastda yozuvlar
    ctx.font = "600 9.5px ui-monospace, Menlo, monospace";
    let ly = cy + r * 1.34;
    for (const row of rows) {
      const value = Math.round(stats && stats[row.key] || 0);
      ctx.fillStyle = P.toCss(row.color, 0.8);
      ctx.fillText(`${row.label} ${value}%`, cx, ly);
      ly += 15;
    }
  }

  // ------------------------------------------------------------- emblema

  // Chap pastdagi dumaloq JARVIS — bosilsa siferblat paneli ochiladi
  function drawEmblem(ctx, cx, cy, r, t, mark, hover) {
    // Nur
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 1.5);
    g.addColorStop(0, P.toCss(P.RGB.cyan, 0.2 * mark));
    g.addColorStop(1, P.toCss(P.RGB.cyan, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 1.5, 0, TAU);
    ctx.fill();

    // Halqalar
    for (const [k, w, a] of [[1, 2, 0.9], [0.8, 1.2, 0.5], [0.62, 1.6, 0.75]]) {
      ctx.beginPath();
      ctx.arc(cx, cy, r * k, 0, TAU);
      ctx.strokeStyle = P.toCss(P.RGB.cyan, a * (hover ? 1.2 : 1) * mark);
      ctx.lineWidth = w;
      ctx.stroke();
    }

    // Aylanuvchi segmentlar
    for (let i = 0; i < 3; i++) {
      const a = t * 0.8 + (i / 3) * TAU;
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.9, a, a + 1.1);
      ctx.strokeStyle = P.toCss(P.RGB.white, 0.35 * mark);
      ctx.lineWidth = 2.4;
      ctx.stroke();
    }

    // Yozuv
    ctx.font = `800 ${Math.round(r * 0.30)}px ui-sans-serif, -apple-system, system-ui, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = P.toCss(P.RGB.cyan, 0.9);
    ctx.shadowBlur = 12 * mark;
    ctx.fillStyle = P.toCss(P.RGB.white, 0.7 + 0.3 * mark);
    ctx.fillText("JARVIS", cx, cy);
    ctx.shadowBlur = 0;
    ctx.textBaseline = "alphabetic";
  }

  // ------------------------------------------------------------- joylashuv

  function layout(W, H) {
    const suitH = Math.min(H * 0.80, W * 0.55);
    return {
      suit: { cx: W * 0.5, topY: H * 0.5 - suitH * 0.52, height: suitH },
      emblem: { x: 118, y: H - 128, r: 62 },
      meter: { x: W - 108, yTop: H * 0.16, height: Math.min(240, H * 0.30) },
      gauge: { x: W - 150, y: H * 0.66, r: 54 },
      gearsTL: { x: 265, y: 138 },
      gearsR: { x: W - 305, y: H * 0.38 },
    };
  }

  /**
   * Bir kadr. f = { width, height, t, state, level, flash, boot, stats:{cpu,ram,disk} }
   *
   * `boot` — sahna qanchalik "yoniq" (0..1). Oyna ochilganda past bo'ladi:
   * hammasi ko'rinadi, lekin ko'zlar o'chgan va yorug'lik pasaygan — Jarvis
   * hali uyquda. Foydalanuvchi gapirganda 1 ga ko'tariladi.
   */
  // Ko'z va reaktor yorqinligi. Wallpaper rejimida sahna chizilmaydi, lekin
  // bu qiymatlar baribir kerak — shuning uchun alohida funksiya.
  function lights(f) {
    const t = f.t || 0;
    const boot = f.boot === undefined ? 1 : Math.max(0, Math.min(1, f.boot));
    const mood = P.STATE_MOOD[f.state] || P.STATE_MOOD.idle;
    const flash = f.flash || 0;
    // Ko'zlar: kutishda xira, uyg'onganda chaqnaydi, o'ylashda sekin pulsatsiya.
    // Uyqu holatida butunlay o'chadi — bu eng ko'zga tashlanadigan belgi.
    let eyes = 0.25 + mood.glow * 0.5 + flash * 0.6;
    if (f.state === "thinking") eyes = 0.45 + Math.abs(Math.sin(t * 2.2)) * 0.3;
    eyes = Math.min(1, eyes) * boot * boot;
    const surge = Math.min(1, mood.core * 0.6 + flash + (f.level || 0) * 0.6) * boot;
    return { eyes, surge };
  }

  function draw(ctx, f) {
    const { width: W, height: H, t } = f;
    const L = layout(W, H);
    ctx.clearRect(0, 0, W, H);

    const boot = f.boot === undefined ? 1 : Math.max(0, Math.min(1, f.boot));
    const mood = P.STATE_MOOD[f.state] || P.STATE_MOOD.idle;
    const active = f.state === "listening" || f.state === "speaking";
    const energy = Math.min(1, mood.glow + f.flash * 0.5) * (0.28 + 0.72 * boot);

    const eyes = lights(f).eyes;

    // Rasm rejimida to'r chizilmaydi — foydalanuvchi rasmi o'zi to'liq fon
    if (!f.figure) drawGrid(ctx, W, H);
    drawMotes(ctx, W, H, t);

    // Markaz: foydalanuvchi rasmi bo'lsa, vektor zirh chizilmaydi —
    // rasm DOM'da turadi, jonli effektlar esa fx qatlamida.
    if (!f.figure) {
      const anchor = SUIT.reactorAt(L.suit);
      drawRings(ctx, anchor.x, anchor.y, L.suit.height * 0.46, t, energy);
    }

    // Shesternyalar
    drawGearCluster(ctx, L.gearsTL.x, L.gearsTL.y, t, 0.8, 0.3);
    drawGearCluster(ctx, L.gearsR.x, L.gearsR.y, t, 1.0, 0.35);

    if (!f.figure) {
      SUIT.draw(ctx, {
        cx: L.suit.cx, topY: L.suit.topY, height: L.suit.height,
        t, eyes, surge: Math.min(1, mood.core * 0.6 + f.flash + f.level * 0.6),
      });

      // Zirh pastini fonga singdirish
      const fade = ctx.createLinearGradient(0, L.suit.topY + L.suit.height * 0.82, 0, L.suit.topY + L.suit.height);
      fade.addColorStop(0, "rgba(3, 8, 12, 0)");
      fade.addColorStop(1, "rgba(3, 8, 12, 0.95)");
      ctx.fillStyle = fade;
      ctx.fillRect(L.suit.cx - L.suit.height, L.suit.topY + L.suit.height * 0.8,
                   L.suit.height * 2, L.suit.height * 0.22);
    }

    if (f.figureRect && f.figure) {
      // Rasm rejimi: datchik rasm o'ng chetidagi shkala ustida
      const r = f.figureRect;
      drawVoiceMeter(ctx, r.x + r.w * 0.972, r.y + r.h * 0.50, r.h * 0.28,
                     f.level, active, t, Math.max(10, r.w * 0.014));
    } else {
      drawVoiceMeter(ctx, L.meter.x, L.meter.yTop, L.meter.height, f.level, active, t);
      drawSystemGauge(ctx, L.gauge.x, L.gauge.y, L.gauge.r, f.stats, t);
      drawEmblem(ctx, L.emblem.x, L.emblem.y, L.emblem.r, t,
                 0.55 + mood.mark * 0.45, f.emblemHover);
    }

    const surge = Math.min(1, mood.core * 0.6 + f.flash + f.level * 0.6) * boot;
    drawVeil(ctx, W, H, boot, t);
    return { eyes, surge };
  }

  // Uyqu pardasi. Canvas fon rasmining ustida turadi, shuning uchun bitta
  // to'rtburchak butun sahnani birdan xiralashtiradi — CSS filtri bilan har
  // kadrda qayta bo'yashdan ancha arzon.
  function drawVeil(ctx, W, H, boot, t) {
    if (boot > 0.995) return;
    const dark = (1 - boot) * 0.7;
    ctx.save();
    ctx.fillStyle = `rgba(2, 7, 11, ${dark.toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);

    // Yoqilish chizig'i: boot ko'tarilayotganda ekran bo'ylab pastga yuguradi.
    // Faqat o'tish davrida ko'rinadi — uyquda ham, to'liq yoniqda ham yo'q.
    const wake = 1 - Math.abs(boot * 2 - 1);
    if (wake > 0.05) {
      const y = H * (0.5 - Math.cos(t * 1.6) * 0.5);
      const g = ctx.createLinearGradient(0, y - 60, 0, y + 60);
      g.addColorStop(0, P.toCss(P.RGB.cyan, 0));
      g.addColorStop(0.5, P.toCss(P.RGB.cyan, 0.10 * wake));
      g.addColorStop(1, P.toCss(P.RGB.cyan, 0));
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = g;
      ctx.fillRect(0, y - 60, W, 120);
    }
    ctx.restore();
  }

  // ------------------------------------------------------------- rasm effektlari

  // Foydalanuvchi rasmi ustidagi jonli qatlam: ko'zlar nuri va reaktor.
  // Nuqtalar kalibrlashda belgilanadi (rasmga nisbatan 0..1 koordinatalar).
  function drawFigureFx(ctx, rect, cal, t, eyes, surge, boot) {
    if (!cal) return;
    const px = (p) => [rect.x + p[0] * rect.w, rect.y + p[1] * rect.h];

    // Uyquda ko'zlar va reaktor O'CHGAN bo'lishi kerak. Muammo shundaki,
    // ular fon rasmining o'zida yoniq holda chizilgan — ustiga qorayituvchi
    // niqob qo'yamiz, keyin nurni qaytadan chizamiz. Natijada yonish
    // haqiqatan yonishga o'xshaydi, shunchaki yorqinlik oshishiga emas.
    const lit = boot === undefined ? 1 : Math.max(0, Math.min(1, boot));
    if (lit < 0.99) {
      // Ko'zlar butunlay o'chadi; reaktor esa faqat pasayadi — uni ham
      // to'liq bo'yasak, chizmadagi halqalar yo'qolib, dog' bo'lib qoladi.
      ctx.save();
      for (const [key, scale, strength] of
           [["eyeL", 1.6, 0.92], ["eyeR", 1.6, 0.92], ["core", 2.4, 0.6]]) {
        if (!cal[key]) continue;
        const mask = (1 - lit) * strength;
        const [x, y] = px(cal[key]);
        const r = rect.w * 0.030 * scale;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(3, 8, 12, ${mask.toFixed(3)})`);
        g.addColorStop(0.6, `rgba(3, 8, 12, ${(mask * 0.75).toFixed(3)})`);
        g.addColorStop(1, "rgba(3, 8, 12, 0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
    }

    ctx.save();
    // Qo'shiluvchi aralashtirish — qora rasm ustida faqat nur ko'rinadi
    ctx.globalCompositeOperation = "lighter";

    // Ko'zlar: pulslanadigan nur
    const eyeR = rect.w * 0.030;
    for (const key of ["eyeL", "eyeR"]) {
      if (!cal[key]) continue;
      const [x, y] = px(cal[key]);
      const g = ctx.createRadialGradient(x, y, 0, x, y, eyeR * (1 + eyes));
      g.addColorStop(0, P.toCss(P.RGB.white, 0.55 * eyes + 0.1));
      g.addColorStop(0.4, P.toCss(P.RGB.cyan, 0.4 * eyes + 0.06));
      g.addColorStop(1, P.toCss(P.RGB.cyan, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, eyeR * (1 + eyes) + 1, 0, TAU);
      ctx.fill();
    }

    // Reaktor: nur + aylanuvchi segmentlar
    if (cal.core) {
      const [x, y] = px(cal.core);
      const r = rect.w * 0.055;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2);
      g.addColorStop(0, P.toCss(P.RGB.white, 0.35 + surge * 0.4));
      g.addColorStop(0.5, P.toCss(P.RGB.cyan, 0.15 + surge * 0.2));
      g.addColorStop(1, P.toCss(P.RGB.cyan, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r * 2, 0, TAU);
      ctx.fill();

      const spin = t * (0.6 + surge * 1.8);
      ctx.lineWidth = 2.5;
      for (let i = 0; i < 8; i++) {
        const a = spin + (i / 8) * TAU;
        ctx.beginPath();
        ctx.arc(x, y, r, a, a + 0.45);
        ctx.strokeStyle = P.toCss(P.RGB.cyan, 0.35 + surge * 0.45);
        ctx.stroke();
      }
      // Teskari aylanuvchi tashqi halqa
      ctx.lineWidth = 1.4;
      for (let i = 0; i < 4; i++) {
        const a = -spin * 0.6 + (i / 4) * TAU;
        ctx.beginPath();
        ctx.arc(x, y, r * 1.45, a, a + 0.7);
        ctx.strokeStyle = P.toCss(P.RGB.cyan, 0.22 + surge * 0.3);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // Rasmdagi JARVIS doirasi ustiga jonli halqa — bosish mumkinligini bildiradi
  function drawEmblemPulse(ctx, rect, emblem, t, mark) {
    const x = rect.x + emblem.c[0] * rect.w;
    const y = rect.y + emblem.c[1] * rect.h;
    const r = emblem.r * rect.w * 0.5;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < 3; i++) {
      const a = t * 0.8 + (i / 3) * TAU;
      ctx.beginPath();
      ctx.arc(x, y, r, a, a + 1.0);
      ctx.strokeStyle = P.toCss(P.RGB.cyan, 0.25 + mark * 0.3);
      ctx.lineWidth = 2.2;
      ctx.stroke();
    }
    ctx.restore();
  }

  // Emblema ustiga bosilganini aniqlash
  function hit(W, H, x, y) {
    const L = layout(W, H);
    const dx = x - L.emblem.x;
    const dy = y - L.emblem.y;
    if (dx * dx + dy * dy <= (L.emblem.r * 1.15) ** 2) return "emblem";
    return null;
  }

  return { draw, hit, layout, lights, drawVeil, drawFigureFx, drawEmblemPulse, BUNDLED };
})();

// Dizayn o'zgarmaydi: ekranda o'sha SHIELD OS rasmi turadi. Faqat undagi

// Usul oddiy: eski raqamni rasmning O'ZIDAN olingan toza ustunni cho'zib
// yopamiz (fon shu tufayli aynan mos tushadi — bir xil naqsh, bir xil
// gradient), so'ng ustiga yangi qiymatni chizamiz. Shuning uchun bu yerdagi
// barcha koordinatalar rasmning asl piksellarida (1920x1080) berilgan.

const LIVE = (() => {

  const pad = (n) => String(n).padStart(2, "0");

  const rateShort = (bps) => {

  function hitTest(nx, ny) {
    const px = nx * IMG_W;
    const py = ny * IMG_H;
    for (const z of ZONES) {
      if (z.circle) {
        const [cx, cy, r] = z.circle;
        if ((px - cx) ** 2 + (py - cy) ** 2 <= r * r) return z;
      } else {
        const [x, y, w, h] = z.box;
        if (px >= x && px <= x + w && py >= y && py <= y + h) return z;
      }
    }
    return null;
  }

  // Ovoz ustunida bosilgan nuqta -> 0..100
  function volumeAt(ny) {
    const [, y, , h] = ZONES.find((z) => z.volume).box;
    const rel = 1 - ((ny * IMG_H) - y) / h;
    return Math.round(Math.max(0, Math.min(1, rel)) * 100);
  }

  // --------------------------------------------------------------- chizish

  /**
   * Rasm ustidagi jonli qatlam.
   *
   * ctx  — fx canvas konteksti (rasm ustida turadi)

   * rect — rasm ekranda egallagan to'rtburchak {x, y, w, h}
   * d    — jonli ma'lumot
   * t    — vaqt (soniya), aylanmalar uchun
   */
  function draw(ctx, img, rect, d, t) {
    if (!img || !img.naturalWidth) return;
    const k = rect.w / IMG_W;
    const X = (px) => rect.x + px * k;
    const Y = (py) => rect.y + py * k;
    const S = (v) => v * k;
    const now = new Date();

    // Eski qiymatni yopish: rasmning O'ZIDAN `srcX` ustunini cho'zib qo'yamiz.
    // Fon gorizontal yo'nalishda deyarli bir xil, shuning uchun ulanish joyi
    // ko'rinmaydi — panel naqshi ham, gradienti ham saqlanadi.
    function cover(px, py, w, h, srcX) {
      ctx.drawImage(img, srcX, py, 2, h, X(px), Y(py), S(w), S(h));
    }

    // Xuddi shu ustunlardan, lekin boshqa qatordan olingan bo'lak. Fon
    // vertikal o'zgaradigan joylarda ustun cho'zishdan tabiiyroq tushadi.
    function coverY(px, py, w, h, srcY) {
      ctx.drawImage(img, px, srcY, w, h, X(px), Y(py), S(w), S(h));
    }

    function txt(str, px, py, size, o = {}) {
      ctx.font = `${o.weight || 400} ${S(size)}px ${o.font || F_TEXT}`;
      ctx.textAlign = o.align || "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = o.color || INK;
      // Shrift har kompyuterda boshqacha o'lchamda chiqadi. Rasmdagi joyga
      // aniq tushishi uchun kerak bo'lsa cho'zamiz-siqamiz: balandligi
      // `fitH` (rasmdagi harf balandligi), kengligi `maxW` bilan chegaralanadi.
      const m = ctx.measureText(str);
      const w = m.width;
      const asc = m.actualBoundingBoxAscent || S(size) * 0.72;
      let sx = 1, sy = 1;
      if (o.fitH) sx = sy = S(o.fitH) / asc;
      if (o.maxW && w * sx > S(o.maxW)) sx = S(o.maxW) / w;
      if (sx !== 1 || sy !== 1) {
        ctx.save();
        ctx.translate(X(px), Y(py));
        ctx.scale(sx, sy);
        ctx.fillText(str, 0, 0);
        ctx.restore();
        return;
      }
      ctx.fillText(str, X(px), Y(py));
    }

    // Soat raqamlari: har biri o'z katagida — rasmdagidek teng oraliqda
    function digits(str, rightPx, basePy, capH, adv, colonAdv, color) {
      // Rasmdagi raqam balandligi `capH` — shriftni aynan shunga moslaymiz
      const size = capH / 0.72;
      ctx.font = `700 ${S(size)}px ${F_CLOCK}`;
      ctx.textAlign = "center";
      ctx.fillStyle = color || INK;
      const asc = ctx.measureText("8").actualBoundingBoxAscent || S(capH);
      const scale = S(capH) / asc;
      let total = 0;
      for (const ch of str) total += ch === ":" ? colonAdv : adv;
      let x = rightPx - total;
      for (const ch of str) {
        const w = ch === ":" ? colonAdv : adv;
        ctx.save();
        ctx.translate(X(x + w / 2), Y(basePy));
        ctx.scale(scale, scale);
        ctx.fillText(ch, 0, 0);

        1680, 155, 12, { align: "center", color: INK_DIM });

    if (d.ramUsedGb !== undefined && d.ramUsedGb !== null) {
      txt(`Used:${gb(d.ramUsedGb)} GB`, 390, 104, 12, { align: "right" });
      txt(`Free:${gb(d.ramTotalGb - d.ramUsedGb)} GB`, 390, 120, 12, { align: "right" });
    }

    // ---- SYSTEM: CPU / RAM / SWAP
    [[d.cpu, 98], [d.ram, 118], [d.swap, 138]].forEach(([value, base]) => {
      const v = Math.max(0, Math.min(100, value || 0));
      ctx.fillStyle = AMBER;
      ctx.fillRect(X(467), Y(base + 3), S(190 * v / 100), Math.max(1, S(2)));

    // ---- DRIVE (HD C / HD D)

      ctx.lineWidth = Math.max(1, S(1));

    // ---- tarmoq: umumiy hajm va tezlik (chapdagi mayda qator)
    txt(`${(net.totalGb || 0).toFixed(1)} GIB - ${rateShort(net.down)}/S`, 285, 165, 9,
        { fitH: 7, maxW: 95, color: INK_DIM });
    txt(`${((net.upTotalGb || 0)).toFixed(1)} GIB - ${rateShort(net.up)}/S`, 385, 165, 9,
        { fitH: 7, maxW: 95, color: INK_DIM });

    // ---- UPLOAD / DOWNLOAD qiymatlari
    txt(rateShort(net.up), 1387, 462, 9, { fitH: 7, maxW: 24, color: INK_DIM });
    txt(rateShort(net.down), 1472, 462, 9, { fitH: 7, maxW: 30, color: INK_DIM });

    // ---- pastdagi o'ngdagi soat (radial menyu yonida)
    txt(`${pad(now.getHours())}:${pad(now.getMinutes())}`, 1373, 780, 22,
        { align: "right", fitH: 16, maxW: 52 });

    // ---- media vaqti
    if (d.media && d.media.position !== undefined && d.media.position !== null) {
      const pos = Math.max(0, Math.round(d.media.position));
      txt(`${Math.floor(pos / 60)}:${pad(pos % 60)}`, 1533, 998, 12, { maxW: 44 });
      // ijro chizig'i — rasmdagi bo'sh ramka to'ladi
      if (d.media.duration) {
        const frac = Math.max(0, Math.min(1, pos / d.media.duration));
        ctx.fillStyle = "rgba(214, 226, 234, 0.55)";
        ctx.fillRect(X(1553), Y(1044), S(232 * frac), S(6));
      }
    }

    // ---- ovoz ustuni (o'ng chekka)
    if (d.volume !== null && d.volume !== undefined) {
      const lit = (d.volume / 100) * 10;
      for (let i = 0; i < 10; i++) {
        const yy = 782 - i * 19;
        ctx.fillStyle = i < lit ? "#f7941e" : "rgba(116, 122, 126, 0.8)";
        ctx.fillRect(X(1889), Y(yy), S(23), S(15));
      }
    }

    // ---- rasmdagi siferblatlar aylanadi
    spin(ctx, X, Y, S, t);

    // ---- sichqoncha ostidagi tugma
    if (d.hover) {
      const z = d.hover;
      ctx.save();
      ctx.strokeStyle = "rgba(120, 226, 255, 0.8)";
      ctx.lineWidth = Math.max(1, S(1.5));
      ctx.shadowColor = "rgba(120, 226, 255, 0.9)";
      ctx.shadowBlur = S(10);
      if (z.circle) {
        const [cx, cy, r] = z.circle;
        ctx.beginPath();
        ctx.arc(X(cx), Y(cy), S(r), 0, TAU);
        ctx.stroke();
      } else {
        const [x, y, w, h] = z.box;
        ctx.strokeRect(X(x) - 2, Y(y) - 2, S(w) + 4, S(h) + 4);
      }
      ctx.restore();
    }
  }

  // Rasmdagi siferblatlar aylanadi: har biriga bir necha yupqa yoy qo'shamiz.
  // Rang va yorqinlik rasmnikiga moslangan — qo'shimcha element emas, xuddi
  // chizmaning o'zi harakatga kelgandek ko'rinadi.
  const DIALS = [
    { c: [560, 585, 86], speed: 0.20, arcs: 3, alpha: 0.34, cyan: false },
    { c: [1400, 556, 58], speed: -0.28, arcs: 2, alpha: 0.30, cyan: false },
    { c: [1487, 127, 34], speed: 0.55, arcs: 2, alpha: 0.40, cyan: false },
    { c: [1590, 122, 30], speed: -0.70, arcs: 2, alpha: 0.40, cyan: false },
    { c: [1640, 790, 58], speed: 0.45, arcs: 3, alpha: 0.55, cyan: true },
    { c: [1640, 790, 40], speed: -0.60, arcs: 2, alpha: 0.45, cyan: true },
  ];

  function spin(ctx, X, Y, S, t) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const dial of DIALS) {
      const [cx, cy, r] = dial.c;
      ctx.lineWidth = Math.max(1, S(2));
      for (let i = 0; i < dial.arcs; i++) {
        const a = t * dial.speed + (i / dial.arcs) * TAU;
        ctx.beginPath();
        ctx.arc(X(cx), Y(cy), S(r), a, a + 0.7);
        ctx.strokeStyle = dial.cyan
          ? `rgba(90, 220, 255, ${dial.alpha})`
          : `rgba(226, 236, 242, ${dial.alpha})`;
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  return { draw, hitTest, volumeAt, ZONES, IMG_W, IMG_H };
})();

                 memory:"XOTIRA", agenda:"REJA", tools:"ASBOB", net:"TARMOQ" };
const systems = Object.entries(LABELS).map(([id, label]) => ({ id, label, status: "ready", detail: "", heat: 0 }));
const heatUntil = {};
const heat = (id, s = 1.4) => { heatUntil[id] = performance.now() / 1000 + s; };

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ds = dialPanel.clientWidth || 330;
  dialCanvas.width = dialCanvas.height = Math.round(ds * dpr);
  dialCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function setState(next) {
  if (next === "wake" && state !== "wake") flash = 1;
  state = next;
  document.querySelectorAll("#drawer [data-state]").forEach((b) =>
    b.classList.toggle("on", b.dataset.state === next));
}

function caption(who, text) {
  captionBox.querySelector("b").textContent = who || "";
  captionBox.querySelector("span").textContent = text || "";
  captionBox.classList.toggle("on", Boolean(text));
}

function frame(now) {
  const t = now / 1000;

  // Ovoz darajasi: tinglash/gapirishda jonlanadi
  const target =
    state === "listening" ? 0.35 + Math.abs(Math.sin(t * 2.7) * Math.sin(t * 1.3)) * 0.55 :
    state === "speaking" ? 0.30 + Math.abs(Math.sin(t * 4.4)) * 0.45 : 0.03;
  level = target;
  smoothLevel += (level - smoothLevel) * (level > smoothLevel ? 0.4 : 0.1);
  flash *= 0.93; if (flash < 0.01) flash = 0;

  DESK.draw(ctx, { width: W, height: H, t, state, level: smoothLevel, flash, stats, emblemHover });

  if (dialPanel.classList.contains("on")) {
    for (const s of systems) {
      const until = heatUntil[s.id] || 0;
      s.heat = s.status === "down" ? 0 : Math.max(0, Math.min(1, (until - t) / 1.4));
    }
    const size = dialCanvas.clientWidth || 314;
    HUD.draw(dialCtx, { width: size, height: size, t, state, level: smoothLevel, flash, systems });
  }
  requestAnimationFrame(frame);
}

  figureImg.src = "data:image/jpeg;base64," + FIGURE_B64;
  figureImg.onload = () => {
    figureOn = true;
    bundled = true;
    figureCal = DESK.BUNDLED.cal;
    figureImg.classList.add("on");
    document.body.classList.add("wallpaper");
  };
}

// Bosiladigan maydonlar — hammasi live.js da, rasmning o'z piksellarida
function zoneAt(clientX, clientY) {
  if (!bundled) return null;
  const rect = figureRect();
  if (!rect) return null;
  const nx = (clientX - rect.x) / rect.w;
  const ny = (clientY - rect.y) / rect.h;
  if (nx < 0 || nx > 1 || ny < 0 || ny > 1) return null;
  return LIVE.hitTest(nx, ny);
}

document.addEventListener("mousemove", (e) => {
  const zone = zoneAt(e.clientX, e.clientY);
  live.hover = zone;
  document.body.style.cursor = zone ? "pointer" : "";
});

document.addEventListener("click", (e) => {
  if (e.target.closest("#drawer") || e.target.closest("#dial-panel")) return;
  const zone = zoneAt(e.clientX, e.clientY);
  if (!zone) return;
  if (zone.dials) { dialPanel.classList.toggle("on"); return; }
  if (zone.activate) { document.getElementById("play").click(); return; }
  if (zone.url) { window.open(zone.url, "_blank"); return; }
  if (zone.app) { caption("Demo", `Haqiqiy ish stolida «${zone.title}» ochiladi`); return; }
  if (zone.folder) { caption("Demo", `Haqiqiy ish stolida «${zone.title}» papkasi ochiladi`); return; }
  if (zone.trash) { caption("Demo", "Haqiqiy ish stolida axlat qutisi ochiladi"); return; }
  if (zone.media) { caption("Demo", `Media: ${zone.title}`); return; }
  if (zone.volume) {
    const rect = figureRect();
    live.volume = LIVE.volumeAt((e.clientY - rect.y) / rect.h);
    caption("Demo", `Tizim ovozi ${live.volume}% ga qo'yiladi`);
  }
});

function fxResize() {
  const dpr = window.devicePixelRatio || 1;
  fxCanvas.width = Math.round(innerWidth * dpr);
  fxCanvas.height = Math.round(innerHeight * dpr);
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function figureRect() {
  const box = figureImg.getBoundingClientRect();
  const nw = figureImg.naturalWidth, nh = figureImg.naturalHeight;
  if (!nw || !nh) return null;
  const scale = Math.min(box.width / nw, box.height / nh);
  const w = nw * scale, h = nh * scale;
  return { x: box.left + (box.width - w) / 2, y: box.top + (box.height - h) / 2, w, h };
}

function startCalibration() {
  calSteps = ["eyeL", "eyeR", "core"];
  document.body.classList.add("calibrating");
  caption("Sozlash", "Rasmda CHAP ko'zga bosing (keyin o'ng ko'z, keyin reaktor)");
}

figureImg.addEventListener("click", (e) => {
  if (!calSteps.length) return;
  const rect = figureRect();
  if (!rect) return;
  const key = calSteps.shift();
  figureCal = figureCal || {};
  figureCal[key] = [(e.clientX - rect.x) / rect.w, (e.clientY - rect.y) / rect.h];
  if (calSteps.length === 2) caption("Sozlash", "Endi O'NG ko'zga bosing");
  else if (calSteps.length === 1) caption("Sozlash", "Endi REAKTORGA bosing");
  else {
    localStorage.setItem("figure-cal", JSON.stringify(figureCal));
    document.body.classList.remove("calibrating");
    caption("Sozlash", "Tayyor! «Uyg'onish»ni bosing — ko'zlar yonadi.");
  }
});

window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!file || !file.type.startsWith("image/")) return;
  figureImg.src = URL.createObjectURL(file);
  figureImg.onload = () => {
    figureOn = true;
    bundled = false;
    document.body.classList.remove("wallpaper");
    figureImg.classList.add("on");
    localStorage.removeItem("figure-cal");
    figureCal = null;
    startCalibration();
  };
});

document.getElementById("drop-hint").addEventListener("click", () =>
  caption("Rasm", "Kompyuterdagi rasm faylini sichqoncha bilan shu oynaga sudrab tashlang"));

/* Kadr siklini rasm rejimini hisobga olib qayta yozamiz */
frame = function patchedFrame(now) {
  const t = now / 1000;

  const target =
    state === "listening" ? 0.35 + Math.abs(Math.sin(t * 2.7) * Math.sin(t * 1.3)) * 0.55 :
    state === "speaking" ? 0.30 + Math.abs(Math.sin(t * 4.4)) * 0.45 : 0.03;
  level = target;
  smoothLevel += (level - smoothLevel) * (level > smoothLevel ? 0.4 : 0.1);
  flash *= 0.93; if (flash < 0.01) flash = 0;

  const rect = figureOn ? figureRect() : null;
  if (bundled) {
    // Wallpaper rejimi: dizayn o'zgarmaydi — sahna canvas'i bo'sh, hamma
    // ish rasm ustidagi jonli qatlamda.
    ctx.clearRect(0, 0, W, H);
    lastFx = DESK.lights({ state, flash, level: smoothLevel, boot: 1, t });
  } else {
    lastFx = DESK.draw(ctx, {
      width: W, height: H, t, state, level: smoothLevel, flash, stats,
      emblemHover, figure: figureOn, figureRect: null,
    }) || lastFx;
  }

  fxCtx.clearRect(0, 0, innerWidth, innerHeight);
  if (bundled && rect) LIVE.draw(fxCtx, figureImg, rect, live, t);
  if (figureOn && figureCal && rect) {
    DESK.drawFigureFx(fxCtx, rect, figureCal, t, lastFx.eyes, lastFx.surge);
    if (bundled) DESK.drawEmblemPulse(fxCtx, rect, DESK.BUNDLED.emblem, t, lastFx.eyes);
  }

  if (dialPanel.classList.contains("on")) {
    for (const s of systems) {
      const until = heatUntil[s.id] || 0;
      s.heat = s.status === "down" ? 0 : Math.max(0, Math.min(1, (until - t) / 1.4));
    }
    const size = dialCanvas.clientWidth || 314;
    HUD.draw(dialCtx, { width: size, height: size, t, state, level: smoothLevel, flash, systems });
  }
  requestAnimationFrame(frame);
};

// Demo uchun jonli o'zgarish: CPU/RAM/tarmoq sekin tebranadi
setInterval(() => {
  live.cpu = Math.max(4, Math.min(96, live.cpu + (Math.random() - 0.5) * 16));
  live.ram = Math.max(35, Math.min(88, live.ram + (Math.random() - 0.5) * 5));
  live.swap = Math.max(0, Math.min(60, live.swap + (Math.random() - 0.5) * 4));
  live.ramUsedGb = live.ramTotalGb * live.ram / 100;
  live.net = {
    down: Math.max(0, live.net.down + (Math.random() - 0.5) * 1.6e6),
    up: Math.max(0, live.net.up + (Math.random() - 0.5) * 3e5),
    totalGb: live.net.totalGb + 0.002,
  };
  live.media = { ...live.media, position: (live.media.position + 2) % live.media.duration };
  stats.cpu = live.cpu; stats.ram = live.ram;
}, 2000);

window.addEventListener("resize", () => { resize(); fxResize(); });
resize();
fxResize();
requestAnimationFrame(frame);
</script>
