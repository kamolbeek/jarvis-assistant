<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<title>Jarvis — ish stoli</title>
<style>
  /* Ish stoli HUD — demo bilan bir xil ko'rinish, lekin jonli ma'lumotlar:
     holat va ovoz yadrodan (WebSocket), CPU/RAM/ob-havo Electron'dan (IPC). */
  :root {
    --cyan: #22e3ff;
    --white: #ecfdff;
    --amber: #ffb23e;
    --red: #ff443a;
    --steel: #2a3540;
    --ink: rgba(6, 14, 20, 0.78);
    --edge: rgba(34, 227, 255, 0.22);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #030a0f;
    color: var(--white);
    font-family: ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #scene { position: fixed; inset: 0; }
  #scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .blk { position: absolute; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; }
  .blk h3 { font-size: 9px; font-weight: 700; letter-spacing: 0.24em; color: rgba(236,253,255,0.4); margin-bottom: 7px; }

  .chip {
    display: flex; align-items: center; gap: 8px;
    width: 150px; padding: 7px 12px; margin-bottom: 7px;
    background: linear-gradient(90deg, rgba(42,53,64,0.85), rgba(42,53,64,0.35));
    border-left: 3px solid var(--amber);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%);
    color: var(--white); font: 600 11px var(--mono); letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 130ms ease, border-color 130ms ease;
  }
  .chip:hover { background: linear-gradient(90deg, rgba(34,227,255,0.22), rgba(42,53,64,0.4)); border-left-color: var(--cyan); }
  .chip:active { filter: brightness(1.5); }
  .chip .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); flex: none; }

  .link {
    display: block; font: 600 10.5px var(--mono); letter-spacing: 0.22em;
    color: rgba(236,253,255,0.6); padding: 3.5px 0; cursor: pointer; text-align: center;
    transition: color 120ms ease, text-shadow 120ms ease;
  }
  .link:hover { color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }

  #rail-left { left: 26px; top: 60px; }
  #vertical-tag {
    left: 8px; top: 50%; transform: rotate(180deg); writing-mode: vertical-rl;
    font: 700 9px var(--mono); letter-spacing: 0.5em; color: rgba(236,253,255,0.25);
  }
  #sys-block { left: 26px; top: 335px; width: 168px; }
  #sys-block .row { display: flex; justify-content: space-between; padding: 2.5px 0; color: rgba(236,253,255,0.75); }
  #sys-block .row b { color: var(--cyan); font-weight: 700; }
  #sys-block .bar { height: 3px; background: rgba(34,227,255,0.12); margin: 1px 0 6px; }
  #sys-block .bar i { display: block; height: 100%; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); transition: width 600ms ease; }
  #sys-block .bar.warm i { background: var(--amber); box-shadow: 0 0 6px var(--amber); }

  #dates {
    top: 22px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 14px; font: 600 12px var(--mono); color: rgba(236,253,255,0.45);
  }
  #dates span.today {
    color: var(--cyan); text-shadow: 0 0 12px var(--cyan);
    border: 1px solid var(--edge); padding: 1px 7px; margin: -2px -8px;
  }

  #links { top: 64px; left: calc(50% - 300px); width: 120px; }

  #weather { top: 70px; right: calc(50% - 330px); width: 150px; }
  #weather .day { margin-bottom: 9px; }
  #weather .day b { display: block; font-size: 11px; color: var(--cyan); letter-spacing: 0.18em; }
  #weather .day span { font-size: 15px; color: var(--white); font-weight: 700; }
  #weather .day small { display: block; font-size: 9.5px; color: rgba(236,253,255,0.5); }

  #disk { top: 26px; right: 30px; text-align: right; color: rgba(236,253,255,0.7); }
  #disk b { color: var(--cyan); }

  #clock {
    right: 205px; top: 47%;
    display: flex; align-items: center; gap: 12px;
    font: 700 30px var(--mono); color: var(--white);
    text-shadow: 0 0 16px rgba(34, 227, 255, 0.6);
  }
  #clock::after { content: ""; width: 90px; height: 1px; background: linear-gradient(90deg, var(--cyan), transparent); }
  #clock small { font-size: 10px; letter-spacing: 0.2em; color: rgba(236,253,255,0.5); align-self: flex-end; margin-bottom: 6px; }

  #folders { right: 30px; bottom: 26px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 560px; }
  #folders .chip { width: auto; margin: 0; border-left-color: var(--steel); background: linear-gradient(90deg, rgba(42,53,64,0.7), rgba(42,53,64,0.25)); }
  #folders .chip:hover { border-left-color: var(--cyan); }

  #caption {
    left: 50%; bottom: 30px; transform: translateX(-50%);
    max-width: 520px; padding: 10px 16px;
    background: var(--ink); border: 1px solid var(--edge); border-radius: 10px;
    font-family: inherit; font-size: 13.5px; letter-spacing: 0; text-align: center;
    opacity: 0; transition: opacity 200ms ease;
  }
  #caption.on { opacity: 1; }
  #caption b { color: var(--cyan); font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; margin-right: 8px; }

  #dial-panel {
    left: 30px; bottom: 210px; width: 330px; height: 330px;
    background: rgba(4, 11, 16, 0.9);
    border: 1px solid var(--edge); border-radius: 16px; padding: 8px;
    display: none;
  }
  #dial-panel.on { display: block; }
  #dial-panel canvas { width: 100%; height: 100%; }

  /* Yadro o'chiq bo'lsa — chekkada bildirish */
  #offline {
    left: 50%; top: 20px; transform: translateX(-50%);
    padding: 5px 14px; border-radius: 8px;
    background: rgba(255, 68, 58, 0.12); border: 1px solid rgba(255, 68, 58, 0.4);
    color: #ffd9d6; font: 600 10.5px var(--mono); letter-spacing: 0.1em;
    display: none;
  }
  #offline.on { display: block; }
</style>
</head>
<body>
<div id="scene">
  <canvas id="hud-canvas"></canvas>

  <div class="blk" id="rail-left">
    <h3>ILOVALAR</h3>
    <div class="chip" data-app="Finder"><span class="dot"></span>Finder</div>
    <div class="chip" data-app="Safari"><span class="dot"></span>Safari</div>
    <div class="chip" data-app="Terminal"><span class="dot"></span>Terminal</div>
    <div class="chip" data-app="Notes"><span class="dot"></span>Eslatmalar</div>
    <div class="chip" data-app="Music"><span class="dot"></span>Musiqa</div>
    <div class="chip" data-app="System Settings"><span class="dot"></span>Sozlamalar</div>
  </div>

  <div class="blk" id="vertical-tag">JARVIS · BOSHQARUV</div>

  <div class="blk" id="sys-block">
    <h3>TIZIM</h3>
    <div class="row"><span>Ish vaqti</span><b id="uptime">—</b></div>
    <div class="row"><span>CPU</span><b id="cpu-txt">—</b></div>
    <div class="bar"><i id="cpu-bar" style="width:0%"></i></div>
    <div class="row"><span>Xotira</span><b id="ram-txt">—</b></div>
    <div class="bar warm"><i id="ram-bar" style="width:0%"></i></div>
    <div class="row"><span>Disk</span><b id="disk-txt">—</b></div>
    <div class="bar"><i id="disk-bar" style="width:0%"></i></div>
  </div>

  <div class="blk" id="dates"></div>

  <div class="blk" id="links">
    <h3 style="text-align:center">TEZKOR</h3>
    <span class="link" data-url="https://youtube.com">YOUTUBE</span>
    <span class="link" data-url="https://gmail.com">GMAIL</span>
    <span class="link" data-url="https://github.com">GITHUB</span>
    <span class="link" data-url="https://t.me">TELEGRAM</span>
    <span class="link" data-url="https://wikipedia.org">WIKIPEDIA</span>
    <span class="link" data-url="https://claude.ai">CLAUDE</span>
  </div>

  <div class="blk" id="weather">
    <div class="day"><b>BUGUN</b><span id="w-today">—</span><small id="w-today-d"></small></div>
    <div class="day"><b>ERTAGA</b><span id="w-tomorrow">—</span><small id="w-tomorrow-d"></small></div>
  </div>

  <div class="blk" id="disk">
    <h3 style="text-align:right">DISK</h3>
    <div><b id="disk-used">—</b> band</div>
    <div><b id="disk-free">—</b> bo'sh</div>
  </div>

  <div class="blk" id="clock"><span id="time">--:--</span><small id="date"></small></div>

  <div class="blk" id="folders">
    <div class="chip" data-folder="downloads">Yuklamalar</div>
    <div class="chip" data-folder="documents">Hujjatlar</div>
    <div class="chip" data-folder="pictures">Rasmlar</div>
    <div class="chip" data-folder="music">Musiqa</div>
    <div class="chip" data-folder="videos">Videolar</div>
    <div class="chip" data-folder="desktop">Ish stoli</div>
  </div>

  <div class="blk" id="caption"><b></b><span></span></div>
  <div class="blk" id="dial-panel"><canvas id="dial-canvas"></canvas></div>
  <div class="blk" id="offline">YADRO BILAN ALOQA YO'Q</div>
</div>

<script src="palette.js"></script>
<script src="suit.js"></script>
<script src="hud.js"></script>
<script src="desktop.js"></script>
<script>
// Ish stoli boshqaruvchisi: yadro (WebSocket) + Electron (IPC) ma'lumotlarini
// DESK sahnasiga uzatadi.

const canvas = document.getElementById("hud-canvas");
const ctx = canvas.getContext("2d");
const dialPanel = document.getElementById("dial-panel");
const dialCanvas = document.getElementById("dial-canvas");
const dialCtx = dialCanvas.getContext("2d");
const captionBox = document.getElementById("caption");
const offline = document.getElementById("offline");

let W = 0, H = 0;
let state = "idle";
let level = 0, smoothLevel = 0, flash = 0;
let emblemHover = false;
let systems = [];
let captionTimer = null;

const stats = { cpu: 0, ram: 0, disk: 0 };

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ds = dialPanel.clientWidth || 330;
  dialCanvas.width = dialCanvas.height = Math.round(ds * dpr);
  dialCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function frame(now) {
  const t = now / 1000;
  smoothLevel += (level - smoothLevel) * (level > smoothLevel ? 0.4 : 0.1);
  flash *= 0.93; if (flash < 0.01) flash = 0;

  DESK.draw(ctx, { width: W, height: H, t, state, level: smoothLevel, flash, stats, emblemHover });

  if (dialPanel.classList.contains("on")) {
    const size = dialCanvas.clientWidth || 314;
    HUD.draw(dialCtx, { width: size, height: size, t, state, level: smoothLevel, flash, systems });
  }
  requestAnimationFrame(frame);
}

function caption(who, text) {
  captionBox.querySelector("b").textContent = who || "";
  captionBox.querySelector("span").textContent = text || "";
  captionBox.classList.toggle("on", Boolean(text));
  clearTimeout(captionTimer);
  if (text) captionTimer = setTimeout(() => captionBox.classList.remove("on"), 9000);
}

// --- Yadro bilan aloqa ---

let socket = null;

function connect() {
  socket = new WebSocket(window.desk.coreUrl);

  socket.addEventListener("open", () => offline.classList.remove("on"));

  socket.addEventListener("message", (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch { return; }
    switch (data.type) {
      case "state":
        if (data.state === "wake" && state !== "wake") flash = 1;
        state = data.state;
        break;
      case "level": level = data.value; break;
      case "health": systems = data.systems || []; break;
      case "transcript": caption("Siz", data.text); break;
      case "say": caption("Jarvis", data.text); break;
    }
  });

  socket.addEventListener("close", () => {
    offline.classList.add("on");
    state = "idle"; level = 0;
    systems = systems.map((s) => ({ ...s, status: "unknown", heat: 0 }));
    setTimeout(connect, 1500);
  });

  socket.addEventListener("error", () => socket.close());
}

// --- Emblema: siferblat paneli ---

canvas.addEventListener("mousemove", (e) => {
  emblemHover = DESK.hit(W, H, e.clientX, e.clientY) === "emblem";
  canvas.style.cursor = emblemHover ? "pointer" : "default";
});
canvas.addEventListener("click", (e) => {
  if (DESK.hit(W, H, e.clientX, e.clientY) === "emblem") dialPanel.classList.toggle("on");
});

// --- Jonli bloklar ---

function tickClock() {
  const d = new Date();
  document.getElementById("time").textContent =
    `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  const days = ["Yak", "Du", "Se", "Chor", "Pay", "Ju", "Shan"];
  document.getElementById("date").textContent = `${days[d.getDay()]} · ${d.getDate()}`;
}
setInterval(tickClock, 5000); tickClock();

(function renderDates() {
  const box = document.getElementById("dates");
  const today = new Date();
  for (let i = -3; i <= 3; i++) {
    const d = new Date(today); d.setDate(today.getDate() + i);
    const el = document.createElement("span");
    el.textContent = d.getDate();
    if (i === 0) el.className = "today";
    box.append(el);
  }
})();

window.desk.onStats((s) => {
  stats.cpu = s.cpu; stats.ram = s.ram; stats.disk = s.disk;
  const h = Math.floor(s.uptimeSec / 3600), m = Math.floor((s.uptimeSec % 3600) / 60);
  document.getElementById("uptime").textContent = `${h}s ${m}d`;
  document.getElementById("cpu-txt").textContent = `${Math.round(s.cpu)}%`;
  document.getElementById("ram-txt").textContent = `${Math.round(s.ram)}%`;
  document.getElementById("disk-txt").textContent = `${Math.round(s.disk)}%`;
  document.getElementById("cpu-bar").style.width = `${s.cpu}%`;
  document.getElementById("ram-bar").style.width = `${s.ram}%`;
  document.getElementById("disk-bar").style.width = `${s.disk}%`;
  if (s.diskUsedGb != null) {
    document.getElementById("disk-used").textContent = `${Math.round(s.diskUsedGb)} GB`;
    document.getElementById("disk-free").textContent = `${Math.round(s.diskFreeGb)} GB`;
  }
});

// Ob-havo kodi -> qisqa tavsif (WMO jadvalidan asosiylari)
const WEATHER_TEXT = [
  [0, "Ochiq"], [1, "Asosan ochiq"], [2, "Yengil bulutli"], [3, "Bulutli"],
  [45, "Tuman"], [51, "Yengil yomg'ir"], [61, "Yomg'ir"], [71, "Qor"],
  [80, "Jala"], [95, "Momaqaldiroq"],
];
function weatherText(code) {
  let text = "—";
  for (const [c, label] of WEATHER_TEXT) if (code >= c) text = label;
  return text;
}

window.desk.onWeather((w) => {
  if (!w) return;
  document.getElementById("w-today").textContent = `${w.today.max}° / ${w.today.min}°`;
  document.getElementById("w-today-d").textContent = weatherText(w.today.code);
  document.getElementById("w-tomorrow").textContent = `${w.tomorrow.max}° / ${w.tomorrow.min}°`;
  document.getElementById("w-tomorrow-d").textContent = weatherText(w.tomorrow.code);
});

// --- Ochish buyruqlari ---

document.querySelectorAll(".chip[data-app]").forEach((c) =>
  c.addEventListener("click", () => window.desk.openApp(c.dataset.app)));
document.querySelectorAll(".chip[data-folder]").forEach((c) =>
  c.addEventListener("click", () => window.desk.openFolder(c.dataset.folder)));
document.querySelectorAll(".link").forEach((l) =>
  l.addEventListener("click", () => window.desk.openUrl(l.dataset.url)));

window.addEventListener("resize", resize);
resize();
connect();
requestAnimationFrame(frame);
</script>
</body>
</html>
