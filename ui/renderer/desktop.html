<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<title>Jarvis — ish stoli</title>
<style>
  /* Sahna butunlay canvas'da chiziladi (shell.js). Bu yerda faqat uning
     ustidagi bir nechta matnli qatlam: suhbat izohi, bo'g'inlar paneli,
     ogohlantirishlar va chiqish yo'li. */
  :root {
    --cyan: #22e3ff;
    --white: #ecfdff;
    --ink: rgba(6, 14, 20, 0.82);
    --edge: rgba(34, 227, 255, 0.22);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #01060a;
    color: var(--white);
    font-family: ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #scene { position: fixed; inset: 0; }
  #scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #fx-canvas { pointer-events: none; }
  #figure {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: none; object-fit: contain; pointer-events: none;
  }
  #figure.on { display: block; }
  body.calibrating #figure { pointer-events: auto; cursor: crosshair; }

  .blk { position: absolute; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; }

  #caption {
    left: 50%; bottom: 112px; transform: translateX(-50%);
    max-width: 560px; padding: 10px 16px;
    background: var(--ink); border: 1px solid var(--edge); border-radius: 10px;
    font-family: inherit; font-size: 13.5px; letter-spacing: 0; text-align: center;
    opacity: 0; transition: opacity 200ms ease;
  }
  #caption.on { opacity: 1; }
  #caption b { color: var(--cyan); font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; margin-right: 8px; }

  #dial-panel {
    left: 30px; bottom: 30px; width: 330px; height: 330px;
    background: rgba(4, 11, 16, 0.94);
    border: 1px solid var(--edge); border-radius: 16px; padding: 8px;
    display: none;
  }
  #dial-panel.on { display: block; }
  #dial-panel canvas { width: 100%; height: 100%; }

  #offline {
    left: 50%; top: 46px; transform: translateX(-50%);
    padding: 5px 14px; border-radius: 8px;
    background: rgba(255, 68, 58, 0.12); border: 1px solid rgba(255, 68, 58, 0.4);
    color: #ffd9d6; font: 600 10.5px var(--mono); letter-spacing: 0.1em;
    display: none;
  }
  #offline.on { display: block; }

  /* Chiqish yo'li doim ko'rinib turadi: oyna butun ekranni egallaydi va
     foydalanuvchi qamalib qolgandek his qilmasligi kerak. */
  #escape-hint {
    top: 14px; left: 50%; transform: translateX(-50%);
    padding: 6px 14px; border-radius: 8px;
    background: rgba(3, 8, 12, 0.86); border: 1px solid var(--edge);
    font: 600 11px var(--mono); letter-spacing: 0.12em; color: var(--cyan);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="scene">
  <img id="figure" alt="" draggable="false" />
  <canvas id="hud-canvas"></canvas>
  <canvas id="fx-canvas"></canvas>

  <div class="blk" id="caption"><b></b><span></span></div>
  <div class="blk" id="dial-panel"><canvas id="dial-canvas"></canvas></div>
  <div class="blk" id="offline">YADRO BILAN ALOQA YO'Q</div>
  <div class="blk" id="escape-hint">ESC — YOPISH</div>
</div>

<script src="palette.js"></script>
<script src="suit.js"></script>
<script src="hud.js"></script>
<script src="figure.js"></script>
<script src="shell.js"></script>
<script src="deskapp.js"></script>
<script>
// Ish stoli boshqaruvchisi: Electron (IPC) va yadro (WebSocket) ma'lumotlarini
// SHELL sahnasiga uzatadi. Chizmaning o'zi shell.js ichida.

// Ko'prik bo'lmasa (sahifa oddiy brauzerda ochilsa) sahna baribir chizilsin.
const desk = window.desk || {
  onStats: () => {}, onWeather: () => {}, onMedia: () => {}, onVisible: () => {},
  openApp: () => {}, openFolder: () => {}, openUrl: () => {}, openTrash: () => {},
  setVolume: () => {}, media: () => {}, show: () => {}, hide: () => {},
  getFigure: async () => null, saveFigure: async () => null, clearFigure: async () => null,
  coreUrl: "ws://127.0.0.1:8765",
};

const figureImg = document.getElementById("figure");
const offline = document.getElementById("offline");

// Rasm ekranda haqiqatan egallagan joy (object-fit: contain hisobida)
function figureRect() {
  const box = figureImg.getBoundingClientRect();
  const nw = figureImg.naturalWidth;
  const nh = figureImg.naturalHeight;
  if (!nw || !nh) return null;
  const scale = Math.min(box.width / nw, box.height / nh);
  const w = nw * scale;
  const h = nh * scale;
  return { x: box.left + (box.width - w) / 2, y: box.top + (box.height - h) / 2, w, h };
}

const app = DESKAPP.start({
  figureRect,
  actions: {
    openApp: (name) => desk.openApp(name),
    openFolder: (key) => desk.openFolder(key),
    openUrl: (url) => desk.openUrl(url),
    openTrash: () => desk.openTrash(),
    setVolume: (value) => desk.setVolume(value),
    media: (action) => desk.media(action),
    activate: () => send({ type: "activate" }),
  },
});

// --- Electron'dan keladigan jonli ma'lumot ---

desk.onStats((s) => app.setStats(s));
desk.onWeather((w) => app.setWeather(w));
desk.onMedia((m) => app.setMedia(m));
desk.onVisible(() => app.sleep());

// --- Yadro bilan aloqa ---

let socket = null;

function connect() {
  socket = new WebSocket(desk.coreUrl);

  socket.addEventListener("open", () => offline.classList.remove("on"));

  socket.addEventListener("message", (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch { return; }
    switch (data.type) {
      // Yadro aniq buyruq yuboradi — holatdan taxmin qilmaymiz.
      case "hud":
        if (data.action === "show") desk.show();
        else if (data.action === "hide") desk.hide();
        break;
      case "state": app.setState(data.state); break;
      case "level": app.setLevel(data.value); break;
      case "health": app.setSystems(data.systems || []); break;
      case "transcript": app.caption("Siz", data.text); app.engage(); break;
      case "say": app.caption("Jarvis", data.text); break;
    }
  });

  socket.addEventListener("close", () => {
    offline.classList.add("on");
    app.setState("idle");
    app.setLevel(0);
    setTimeout(connect, 1500);
  });

  socket.addEventListener("error", () => socket.close());
}

function send(message) {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message));
}

// --- Ixtiyoriy fon rasmi ---
//
// Foydalanuvchi o'z rasmini (masalan, eski wallpaperini) oynaga tashlashi
// mumkin. Shunda markazdagi vektor zirh o'rniga o'sha rasm turadi, atrofdagi
// jonli panellar esa joyida qoladi. Uch marta bosib sozlanadi: chap ko'z,
// o'ng ko'z, reaktor — shundan keyin rasmning ko'zlari ham yonadi.

let figureCal = null;
let calSteps = [];

try { figureCal = JSON.parse(localStorage.getItem("figure-cal") || "null"); } catch { figureCal = null; }

function startCalibration() {
  calSteps = ["eyeL", "eyeR", "core"];
  document.body.classList.add("calibrating");
  app.caption("Sozlash", "Rasmda CHAP ko'zga bosing (keyin o'ng ko'z, keyin reaktor)");
}

figureImg.addEventListener("click", (e) => {
  if (!calSteps.length) return;
  const rect = figureRect();
  if (!rect) return;
  const key = calSteps.shift();
  figureCal = figureCal || {};
  figureCal[key] = [(e.clientX - rect.x) / rect.w, (e.clientY - rect.y) / rect.h];
  app.setFigure(true, figureCal);
  if (calSteps.length === 2) app.caption("Sozlash", "Endi O'NG ko'zga bosing");
  else if (calSteps.length === 1) app.caption("Sozlash", "Endi REAKTORGA bosing");
  else {
    localStorage.setItem("figure-cal", JSON.stringify(figureCal));
    document.body.classList.remove("calibrating");
    app.caption("Sozlash", "Tayyor! «Hey Jarvis» deganda ko'zlar yonadi.");
  }
});

function showFigure(path, calibrate) {
  figureImg.src = "file://" + path + "?v=" + Math.random();
  figureImg.onload = () => {
    figureImg.classList.add("on");
    app.setFigure(true, figureCal);
    if (calibrate && !figureCal) startCalibration();
  };
  figureImg.onerror = () => {
    // Fayl o'chirilgan yoki buzilgan — vektor sahna o'zi to'liq ishlaydi
    figureImg.classList.remove("on");
    app.setFigure(false, null);
  };
}

(async function loadFigure() {
  let saved = null;
  try { saved = await desk.getFigure(); } catch { saved = null; }
  if (saved) showFigure(saved, true);
})();

window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", async (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!file || !file.type.startsWith("image/")) return;
  const buffer = await file.arrayBuffer();
  const saved = await desk.saveFigure(new Uint8Array(buffer));
  if (!saved) return;
  localStorage.removeItem("figure-cal");
  figureCal = null;
  showFigure(saved, true);
});

// Esc — oynani yashiradi. Qarsak, «hey jarvis» yoki ⌘⇧J bilan qaytadi.
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") desk.hide();
  // Fon rasmini olib tashlash: vektor sahnaga qaytadi
  if (e.key === "Backspace" && figureImg.classList.contains("on")) {
    desk.clearFigure();
    figureImg.classList.remove("on");
    app.setFigure(false, null);
    app.caption("Sozlash", "Fon rasmi olib tashlandi");
  }
});

connect();
</script>
</body>
</html>
