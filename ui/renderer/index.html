<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <title>Jarvis</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="stage">
      <!-- HUD: bosilsa Jarvis uyg'onadi -->
      <div id="orb-wrap" class="interactive" title="Jarvis'ni chaqirish">
        <canvas id="orb"></canvas>
        <div id="status-dot"></div>
      </div>

      <!-- Siferblat ustiga sichqoncha kelganda nima buzilganini ko'rsatadi -->
      <div id="dial-tip" class="hidden"></div>

      <!-- Jarvis uzoq ish bilan band: bu paytda gapirish behuda ketadi.
           Shuning uchun yozuv yo'qolmaydi — ish tugagunicha turadi. -->
      <div id="work" class="hidden">
        <span class="pulse"></span>
        <span id="work-text"></span>
      </div>

      <!-- Doimiy holat qatori: Jarvis hozir nima qilayotgani. Hech qachon
           yo'qolmaydi — «uxlayaptimi yoki ishlayaptimi» degan savol
           qolmasligi kerak. -->
      <div id="status">
        <span id="status-state">KUTMOQDA</span>
        <span id="status-what"></span>
      </div>

      <!-- Nosozlik: keyingi muvaffaqiyatli qadamgacha ekranda turadi -->
      <div id="problem" class="hidden"></div>

      <!-- Nima eshitilgani / Jarvis nima deyayotgani -->
      <div id="caption" class="panel hidden">
        <span id="caption-role"></span>
        <p id="caption-text"></p>
      </div>

      <!-- Xavfsizlik darvozasi tasdiq so'raganda -->
      <div id="confirm" class="panel hidden interactive">
        <p id="confirm-action"></p>
        <pre id="confirm-detail"></pre>
        <div class="row">
          <button id="approve" class="btn ok">Ha</button>
          <button id="deny" class="btn no">Yo'q</button>
        </div>
        <span class="hint">Enter — ha · Esc — yo'q</span>
      </div>

      <!-- Ulanish yo'qolganda -->
      <div id="offline" class="panel warn hidden">
        Yadro bilan aloqa yo'q — <code>jarvis</code> ishga tushganini tekshiring
      </div>
    </div>

    <script src="palette.js"></script>
    <script src="hud.js"></script>
    <script src="orb.js"></script>
  </body>
</html>
